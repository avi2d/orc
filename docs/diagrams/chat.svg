<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" class="orc-d" role="img" aria-labelledby="d-chat-title d-chat-desc">
<title id="d-chat-title">The chat: your words in, backlog commands out</title>
<desc id="d-chat-desc">You say the work, an answer or a merge in orc chat. The chat is a Pi session with ten tools, each one an orc command, so it can change the backlog and nothing else. It starts nothing itself: the beat starts the tasks. Every 15 seconds it reads the backlog and posts what changed: closed tasks, questions that wait on you, pull request events and alerts. Your rules file steers both the chat and the decider.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#fbe7ae, #4d3b12);
  --d-end-soft: light-dark(#d9d5cf, #45403b);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .card-end { fill: var(--d-end-soft); stroke: var(--d-mute); stroke-width: 1.5; }
.orc-d .line-aside { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .chevron { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .bar { fill: none; stroke: var(--d-mute); stroke-width: 3; stroke-linecap: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-aside { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="8" y="8" width="170" height="550" rx="14" class="zone"/><text x="20" y="29" class="label" text-anchor="start"><tspan x="20" dy="0">You</tspan></text>
<rect x="198" y="8" width="380" height="550" rx="14" class="zone"/><text x="210" y="29" class="label" text-anchor="start"><tspan x="210" dy="0"><tspan class="code">orc chat</tspan></tspan></text>
<rect x="598" y="8" width="354" height="550" rx="14" class="zone"/><text x="610" y="29" class="label" text-anchor="start"><tspan x="610" dy="0">Ten tools, each one an <tspan class="code">orc</tspan> command</tspan></text>
<rect x="18" y="42" width="150" height="160" rx="10" class="card"/><text x="30" y="70" class="title" text-anchor="start"><tspan x="30" dy="0">You say</tspan></text><circle cx="33" cy="88" r="2" class="dot-mute-strong"/><text x="42" y="92" class="" text-anchor="start"><tspan x="42" dy="0">the work, in plain</tspan><tspan x="42" dy="16">words</tspan></text><circle cx="33" cy="122" r="2" class="dot-mute-strong"/><text x="42" y="126" class="" text-anchor="start"><tspan x="42" dy="0">an answer to a</tspan><tspan x="42" dy="16">question</tspan></text><circle cx="33" cy="156" r="2" class="dot-mute-strong"/><text x="42" y="160" class="" text-anchor="start"><tspan x="42" dy="0">to merge a pull</tspan><tspan x="42" dy="16">request</tspan></text>
<rect x="18" y="330" width="150" height="100" rx="10" class="card"/><text x="30" y="358" class="title" text-anchor="start"><tspan x="30" dy="0">You read</tspan></text><text x="30" y="376" class="" text-anchor="start"><tspan x="30" dy="0">Each change, posted</tspan><tspan x="30" dy="16">as it happens.</tspan></text>
<rect x="208" y="42" width="360" height="96" rx="10" class="card"/><text x="220" y="70" class="title" text-anchor="start"><tspan x="220" dy="0">The orchestrator model</tspan></text><text x="220" y="88" class="" text-anchor="start"><tspan x="220" dy="0">A Pi session with ten tools and no others. It can</tspan><tspan x="220" dy="16">change the backlog and nothing else.</tspan></text>
<g data-part="attention"><rect x="208" y="150" width="360" height="96" rx="10" class="card"/><text x="220" y="178" class="title" text-anchor="start"><tspan x="220" dy="0">Your rules</tspan></text><text x="220" y="196" class="" text-anchor="start"><tspan x="220" dy="0"><tspan class="code">~/.orc/orchestrator.md</tspan>, and each project's</tspan><tspan x="220" dy="16">instructions file. The decider reads the same files.</tspan></text><path d="M549,168 l5,5.5 l-5,5.5" class="chevron"/></g>
<rect x="208" y="268" width="360" height="212" rx="10" class="card"/><text x="220" y="296" class="title" text-anchor="start"><tspan x="220" dy="0">It posts what changed</tspan></text><text x="220" y="314" class="" text-anchor="start"><tspan x="220" dy="0">It reads <tspan class="code">orc backlog --json</tspan> every 15 seconds.</tspan></text><circle cx="223" cy="336" r="2" class="dot-mute-strong"/><text x="232" y="340" class="" text-anchor="start"><tspan x="232" dy="0">each task that closed, with its outcome and its</tspan><tspan x="232" dy="16">pull request or report</tspan></text><circle cx="223" cy="370" r="2" class="dot-mute-strong"/><text x="232" y="374" class="" text-anchor="start"><tspan x="232" dy="0">each held task and each parked question that waits</tspan><tspan x="232" dy="16">on you</tspan></text><circle cx="223" cy="404" r="2" class="dot-mute-strong"/><text x="232" y="408" class="" text-anchor="start"><tspan x="232" dy="0">a stalled run, and a pull request that turned</tspan><tspan x="232" dy="16">green, merged or closed</tspan></text><circle cx="223" cy="438" r="2" class="dot-mute-strong"/><text x="232" y="442" class="" text-anchor="start"><tspan x="232" dy="0">each alert from the dashboard</tspan></text>
<rect x="608" y="42" width="334" height="122" rx="10" class="card"/><text x="620" y="70" class="title" text-anchor="start"><tspan x="620" dy="0">Shape the backlog</tspan></text><circle cx="623" cy="88" r="2" class="dot-mute-strong"/><text x="632" y="92" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog_add</tspan>: adds a task</tspan></text><circle cx="623" cy="106" r="2" class="dot-mute-strong"/><text x="632" y="110" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog_edit</tspan>: replaces its title and body</tspan></text><circle cx="623" cy="124" r="2" class="dot-mute-strong"/><text x="632" y="128" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog_priority</tspan>: sets its priority</tspan></text><circle cx="623" cy="142" r="2" class="dot-mute-strong"/><text x="632" y="146" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog_hold</tspan>: holds it for your decision</tspan></text>
<rect x="608" y="170" width="334" height="220" rx="10" class="card"/><text x="620" y="198" class="title" text-anchor="start"><tspan x="620" dy="0">Read and answer</tspan></text><circle cx="623" cy="216" r="2" class="dot-mute-strong"/><text x="632" y="220" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog</tspan>: reads every project, machine and</tspan><tspan x="632" dy="16">task</tspan></text><circle cx="623" cy="250" r="2" class="dot-mute-strong"/><text x="632" y="254" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_backlog_answer</tspan>: answers a held or parked</tspan><tspan x="632" dy="16">task, a decision, or a run at its gate</tspan></text><circle cx="623" cy="284" r="2" class="dot-mute-strong"/><text x="632" y="288" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_attention</tspan>: reads the attention queue</tspan></text><circle cx="623" cy="302" r="2" class="dot-mute-strong"/><text x="632" y="306" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_attention_answer</tspan>: answers a check-red,</tspan><tspan x="632" dy="16">run-died or pr-ready item</tspan></text><circle cx="623" cy="336" r="2" class="dot-mute-strong"/><text x="632" y="340" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">orc_decision_board</tspan>: opens a page with one</tspan><tspan x="632" dy="16">card per open question</tspan></text>
<g data-part="merge"><rect x="608" y="396" width="334" height="70" rx="10" class="card"/><text x="620" y="424" class="title" text-anchor="start"><tspan x="620" dy="0">Merge</tspan></text><circle cx="623" cy="442" r="2" class="dot-mute-strong"/><text x="632" y="446" class="" text-anchor="start"><tspan x="632" dy="0"><tspan class="code">merge_task</tspan>: runs <tspan class="code">orc merge</tspan></tspan></text><path d="M923,414 l5,5.5 l-5,5.5" class="chevron"/></g>
<g data-part="backlog"><rect x="608" y="472" width="334" height="78" rx="10" class="card"/><text x="620" y="500" class="title" text-anchor="start"><tspan x="620" dy="0">The backlog</tspan></text><text x="620" y="518" class="" text-anchor="start"><tspan x="620" dy="0">The chat starts nothing. The beat starts a task</tspan><tspan x="620" dy="16">once it has a priority.</tspan></text><path d="M923,490 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M168,90 L206,90" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(206,90) rotate(0)"/>
<path d="M568,90 L606,90" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(606,90) rotate(0)"/>
<path d="M606,511 L570,511" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(570,511) rotate(180)"/>
<path d="M206,380 L170,380" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(170,380) rotate(180)"/>
</svg>
