<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1086" class="orc-d" role="img" aria-labelledby="how-orc-works-route.tall-title how-orc-works-route.tall-desc">
<title id="how-orc-works-route.tall-title">How orc works: the route of one task</title>
<desc id="how-orc-works-route.tall-desc">You describe the work. The backlog keeps it as one file per task. The beat picks what starts, on a machine with a free slot and an account with room. The runner queues it, an agent writes the change, the checks and a review judge it, and a pull request opens that you merge. A run's question waits in the attention queue, where a small model answers the routine ones from your rules and you answer the rest.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
</style>
<path d="M26,50 V630" class="line-work"/>
<text x="48" y="22" class="label" text-anchor="start"><tspan x="48" dy="0">You</tspan></text>
<text x="48" y="55" class="title" text-anchor="start"><tspan x="48" dy="0">You describe the work</tspan></text>
<text x="48" y="75" class="" text-anchor="start"><tspan x="48" dy="0">In the chat, or as a task file you add.</tspan></text>
<text x="48" y="119" class="label" text-anchor="start"><tspan x="48" dy="0">The machine that plans</tspan></text>
<text x="48" y="152" class="title" text-anchor="start"><tspan x="48" dy="0">The backlog keeps it</tspan></text>
<text x="48" y="172" class="" text-anchor="start"><tspan x="48" dy="0">One file per task, in priority order.</tspan></text>
<text x="48" y="223" class="title" text-anchor="start"><tspan x="48" dy="0">The beat picks what starts</tspan></text>
<text x="48" y="243" class="" text-anchor="start"><tspan x="48" dy="0">Every few minutes: a task with a priority,</tspan><tspan x="48" dy="17">a free machine and an account with room.</tspan></text>
<rect x="48" y="276" width="300" height="34" rx="8" class="card-work"/>
<text x="60" y="297" class="" text-anchor="start"><tspan x="60" dy="0">Quota: room left on each account</tspan></text>
<text x="48" y="346" class="label" text-anchor="start"><tspan x="48" dy="0">A machine that works</tspan></text>
<text x="48" y="379" class="title" text-anchor="start"><tspan x="48" dy="0">The runner queues it</tspan></text>
<text x="48" y="399" class="" text-anchor="start"><tspan x="48" dy="0">A queue on that machine, a few tasks at a time.</tspan></text>
<text x="48" y="450" class="title" text-anchor="start"><tspan x="48" dy="0">An agent writes the change</tspan></text>
<text x="48" y="470" class="" text-anchor="start"><tspan x="48" dy="0">On its own copy of the project, on a new branch.</tspan></text>
<text x="48" y="521" class="title" text-anchor="start"><tspan x="48" dy="0">Checks, then a review</tspan></text>
<text x="48" y="541" class="" text-anchor="start"><tspan x="48" dy="0">The agent fixes what the checks refuse.</tspan><tspan x="48" dy="17">Then a review reads the branch.</tspan></text>
<text x="48" y="602" class="label" text-anchor="start"><tspan x="48" dy="0">GitHub</tspan></text>
<text x="48" y="635" class="title" text-anchor="start"><tspan x="48" dy="0">A pull request you merge</tspan></text>
<text x="48" y="655" class="" text-anchor="start"><tspan x="48" dy="0">Opened after the review. You merge it</tspan><tspan x="48" dy="17">once CI is green.</tspan></text>
<circle cx="26" cy="50" r="12" class="dot-work"/><text x="26" y="54.5" class="num" text-anchor="middle"><tspan x="26" dy="0">1</tspan></text>
<circle cx="26" cy="147" r="12" class="dot-work"/><text x="26" y="151.5" class="num" text-anchor="middle"><tspan x="26" dy="0">2</tspan></text>
<circle cx="26" cy="218" r="12" class="dot-work"/><text x="26" y="222.5" class="num" text-anchor="middle"><tspan x="26" dy="0">3</tspan></text>
<circle cx="26" cy="374" r="12" class="dot-work"/><text x="26" y="378.5" class="num" text-anchor="middle"><tspan x="26" dy="0">4</tspan></text>
<circle cx="26" cy="445" r="12" class="dot-work"/><text x="26" y="449.5" class="num" text-anchor="middle"><tspan x="26" dy="0">5</tspan></text>
<circle cx="26" cy="516" r="12" class="dot-work"/><text x="26" y="520.5" class="num" text-anchor="middle"><tspan x="26" dy="0">6</tspan></text>
<circle cx="26" cy="630" r="12" class="dot-work"/><text x="26" y="634.5" class="num" text-anchor="middle"><tspan x="26" dy="0">7</tspan></text>
<text x="12" y="722" class="ask-text" text-anchor="start"><tspan x="12" dy="0">When a run has a question it cannot settle</tspan></text>
<rect x="12" y="736" width="336" height="65" rx="10" class="card-ask"/>
<text x="24" y="761" class="title" text-anchor="start"><tspan x="24" dy="0">The attention queue</tspan></text>
<text x="24" y="782" class="" text-anchor="start"><tspan x="24" dy="0">Every open question waits here.</tspan></text>
<path d="M180,803 L180,823" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,823) rotate(90)"/>
<rect x="12" y="825" width="336" height="65" rx="10" class="card-ask"/>
<text x="24" y="850" class="title" text-anchor="start"><tspan x="24" dy="0">A small model answers the routine ones</tspan></text>
<text x="24" y="871" class="" text-anchor="start"><tspan x="24" dy="0">Only by quoting a rule you wrote.</tspan></text>
<path d="M180,892 L180,912" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,912) rotate(90)"/>
<rect x="12" y="914" width="336" height="82" rx="10" class="card-ask"/>
<text x="24" y="939" class="title" text-anchor="start"><tspan x="24" dy="0">You answer the rest</tspan></text>
<text x="24" y="960" class="" text-anchor="start"><tspan x="24" dy="0">The chat tells you when a question waits</tspan><tspan x="24" dy="17">and when a task ends.</tspan></text>
<rect x="12" y="1012" width="336" height="66" rx="10" class="card"/>
<text x="24" y="1037" class="title" text-anchor="start"><tspan x="24" dy="0">The app and the dashboard</tspan></text>
<text x="24" y="1058" class="" text-anchor="start"><tspan x="24" dy="0">They show all of this, and they only read.</tspan></text>
</svg>
