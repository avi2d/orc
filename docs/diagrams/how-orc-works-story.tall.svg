<path d="M80,70 h80" class="faint"/>
<path d="M80,82 h48" class="faint"/>
<path d="M188,68 L220,68" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(220,68) rotate(0)"/>
<rect x="230" y="32" width="70" height="88" rx="6" class="card-work"/>
<text x="240" y="54" class="code" text-anchor="start"><tspan x="240" dy="0">orc-9</tspan></text>
<path d="M240,70 h50" class="faint"/>
<path d="M240,82 h50" class="faint"/>
<path d="M240,94 h30" class="faint"/>
<circle cx="34" cy="158" r="12" class="dot-work"/><text x="34" y="162.5" class="num" text-anchor="middle"><tspan x="34" dy="0">1</tspan></text>
<text x="54" y="163" class="big" text-anchor="start"><tspan x="54" dy="0">You say what you want</tspan></text>
<text x="22" y="191" class="" text-anchor="start"><tspan x="22" dy="0">Tell the chat, or add a task file.</tspan><tspan x="22" dy="17">Each task is one file in the backlog.</tspan></text>
<rect x="8" y="238" width="344" height="218" rx="14" class="card"/>
<rect x="40" y="250" width="280" height="112" rx="10" class="zone"/>
<circle cx="94" cy="306" r="30" class="card"/>
<path d="M94,306 V288 M94,306 H107.5" class="line"/>
<rect x="152" y="260" width="150" height="26" rx="6" class="card-work"/>
<text x="162" y="277.5" class="" text-anchor="start"><tspan x="162" dy="0">orc-9</tspan></text>
<text x="292" y="277.5" class="work-text" text-anchor="end"><tspan x="292" dy="0">starts</tspan></text>
<rect x="152" y="293" width="150" height="26" rx="6" class="card"/>
<text x="162" y="310.5" class="" text-anchor="start"><tspan x="162" dy="0">orc-10</tspan></text>
<text x="292" y="310.5" class="" text-anchor="end"><tspan x="292" dy="0">waits</tspan></text>
<rect x="152" y="326" width="150" height="26" rx="6" class="card"/>
<text x="162" y="343.5" class="" text-anchor="start"><tspan x="162" dy="0">orc-11</tspan></text>
<text x="292" y="343.5" class="" text-anchor="end"><tspan x="292" dy="0">waits</tspan></text>
<circle cx="34" cy="388" r="12" class="dot-work"/><text x="34" y="392.5" class="num" text-anchor="middle"><tspan x="34" dy="0">2</tspan></text>
<text x="54" y="393" class="big" text-anchor="start"><tspan x="54" dy="0">The beat picks what can start</tspan></text>
<text x="22" y="421" class="" text-anchor="start"><tspan x="22" dy="0">Every few minutes it looks for a free</tspan><tspan x="22" dy="17">machine and an account with room.</tspan></text>
<rect x="8" y="468" width="344" height="218" rx="14" class="card"/>
<rect x="40" y="480" width="280" height="112" rx="10" class="zone"/>
<rect x="60" y="492" width="156" height="88" rx="8" class="card"/>
<circle cx="72" cy="504" r="3" class="dot-mute"/>
<circle cx="82" cy="504" r="3" class="dot-mute"/>
<circle cx="92" cy="504" r="3" class="dot-mute"/>
<path d="M72,524 l6,5 l-6,5" class="line-work"/>
<path d="M86,529 h70" class="faint"/>
<path d="M72,546 h110" class="faint"/>
<path d="M72,560 h84" class="faint"/>
<path d="M248,496 V576" class="line"/>
<circle cx="248" cy="500" r="5" class="dot-mute"/>
<circle cx="248" cy="568" r="5" class="dot-mute"/>
<path d="M248,568 C248,540 284,556 284,530 V506" class="line-work"/>
<circle cx="284" cy="530" r="5" class="dot-work"/>
<circle cx="284" cy="506" r="5" class="dot-work"/>
<circle cx="34" cy="618" r="12" class="dot-work"/><text x="34" y="622.5" class="num" text-anchor="middle"><tspan x="34" dy="0">3</tspan></text>
<text x="54" y="623" class="big" text-anchor="start"><tspan x="54" dy="0">An agent writes the change</tspan></text>
<text x="22" y="651" class="" text-anchor="start"><tspan x="22" dy="0">On that machine, in its own copy of</tspan><tspan x="22" dy="17">the project, on a new branch.</tspan></text>
<rect x="8" y="698" width="344" height="218" rx="14" class="card"/>
<rect x="40" y="710" width="280" height="112" rx="10" class="zone"/>
<rect x="60" y="732" width="106" height="40" rx="8" class="card"/>
<text x="74" y="757" class="title" text-anchor="start"><tspan x="74" dy="0">Checks</tspan></text>
<circle cx="148" cy="752" r="9" class="dot-ok"/><path d="M144,752 l3,3.2 l5.2,-6" fill="none" stroke="var(--d-card)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170,752 L192,752" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(192,752) rotate(0)"/>
<rect x="196" y="732" width="106" height="40" rx="8" class="card"/>
