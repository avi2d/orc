<path d="M130,1220 L152,1220 L152,1198 L174,1198" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(174,1198) rotate(0)"/>
<path d="M130,1232 L152,1232 L152,1254 L174,1254" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(174,1254) rotate(0)"/>
<rect x="178" y="1180" width="128" height="36" rx="8" class="card"/>
<text x="242" y="1203" class="" text-anchor="middle"><tspan x="242" dy="0">a small model</tspan></text>
<rect x="178" y="1236" width="128" height="36" rx="8" class="card"/>
<text x="242" y="1259" class="" text-anchor="middle"><tspan x="242" dy="0">you</tspan></text>
<circle cx="34" cy="1308" r="12" class="dot-work"/><text x="34" y="1312.5" class="num" text-anchor="middle"><tspan x="34" dy="0">6</tspan></text>
<text x="54" y="1313" class="big" text-anchor="start"><tspan x="54" dy="0">A question stops only that task</tspan></text>
<text x="22" y="1341" class="" text-anchor="start"><tspan x="22" dy="0">A small model answers routine ones from</tspan><tspan x="22" dy="17">your rules. The rest come to you in the chat.</tspan></text>
</svg>
