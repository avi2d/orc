<circle cx="284" cy="752" r="9" class="dot-ok"/><path d="M280,752 l3,3.2 l5.2,-6" fill="none" stroke="var(--d-card)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M140,774 L140,796 L86,796 L86,776" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(86,776) rotate(-90)"/>
<text x="152" y="800" class="ask-text" text-anchor="start"><tspan x="152" dy="0">refused: fix and run again</tspan></text>
<circle cx="34" cy="848" r="12" class="dot-work"/><text x="34" y="852.5" class="num" text-anchor="middle"><tspan x="34" dy="0">4</tspan></text>
<text x="54" y="853" class="big" text-anchor="start"><tspan x="54" dy="0">Checks and a review judge it</tspan></text>
<text x="22" y="881" class="" text-anchor="start"><tspan x="22" dy="0">The agent fixes what the checks refuse.</tspan><tspan x="22" dy="17">Then a review reads the branch.</tspan></text>
<rect x="8" y="928" width="344" height="218" rx="14" class="card"/>
<rect x="40" y="940" width="280" height="112" rx="10" class="zone"/>
<rect x="60" y="956" width="132" height="80" rx="8" class="card"/>
<text x="72" y="980" class="title" text-anchor="start"><tspan x="72" dy="0">Pull request</tspan></text>
<path d="M72,996 h96" class="faint"/>
<circle cx="82" cy="1016" r="9" class="dot-ok"/><path d="M78,1016 l3,3.2 l5.2,-6" fill="none" stroke="var(--d-card)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="1020.5" class="ok-text" text-anchor="start"><tspan x="98" dy="0">CI green</tspan></text>
<path d="M198,996 L226,996" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(226,996) rotate(0)"/>
<rect x="230" y="978" width="72" height="36" rx="18" class="card-ok"/>
<text x="266" y="1000.5" class="ok-text" text-anchor="middle"><tspan x="266" dy="0">merged</tspan></text>
<circle cx="34" cy="1078" r="12" class="dot-work"/><text x="34" y="1082.5" class="num" text-anchor="middle"><tspan x="34" dy="0">5</tspan></text>
<text x="54" y="1083" class="big" text-anchor="start"><tspan x="54" dy="0">You merge the pull request</tspan></text>
<text x="22" y="1111" class="" text-anchor="start"><tspan x="22" dy="0">It opens after the review. <tspan class="code">orc merge</tspan></tspan><tspan x="22" dy="17">lands it once CI is green.</tspan></text>
