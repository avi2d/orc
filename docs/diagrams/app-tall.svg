<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1088" class="orc-d" role="img" aria-labelledby="d-app-tall-title d-app-tall-desc">
<title id="d-app-tall-title">The app and the dashboard: two screens over the same commands</title>
<desc id="d-app-tall-desc">The Herdr App layout and the orc-dash terminal dashboard hold no state of their own. Both run the orc commands and draw what those print. The app has a Board tab, an Agents tab, a Resources tab and a chat drawer. The dashboard shows the same facts as panels in a terminal, and its alert stream is where the chat's alerts come from.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="380" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">What both screens draw</tspan></text>
<rect x="16" y="36" width="328" height="62" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">The state</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">Files in <tspan class="code">~/.orc</tspan>, and the pueue queues.</tspan></text>
<path d="M180,100 L180,120" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,120) rotate(90)"/>
<rect x="16" y="122" width="328" height="78" rx="10" class="card"/><text x="28" y="150" class="title" text-anchor="start"><tspan x="28" dy="0">The <tspan class="code">orc</tspan> commands</tspan></text><text x="28" y="168" class="" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc backlog</tspan>, <tspan class="code">orc runs</tspan> and <tspan class="code">orc attention</tspan>,</tspan><tspan x="28" dy="16">printed as JSON.</tspan></text>
<rect x="16" y="208" width="328" height="62" rx="10" class="card"/><text x="28" y="236" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc-dash snapshot</tspan></tspan></text><text x="28" y="254" class="" text-anchor="start"><tspan x="28" dy="0">What the Resources tab draws.</tspan></text>
<rect x="16" y="278" width="328" height="94" rx="10" class="card-work"/><text x="28" y="306" class="title" text-anchor="start"><tspan x="28" dy="0">Neither screen holds state of its own</tspan></text><text x="28" y="324" class="" text-anchor="start"><tspan x="28" dy="0">Both run the <tspan class="code">orc</tspan> commands and draw what those</tspan><tspan x="28" dy="16">print, so a screen and the command line never</tspan><tspan x="28" dy="16">disagree.</tspan></text>
<path d="M180,387 L180,405" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,405) rotate(90)"/>
<rect x="4" y="408" width="352" height="428" rx="14" class="zone"/><text x="16" y="429" class="label" text-anchor="start"><tspan x="16" dy="0">The Herdr App</tspan></text>
<g data-part="backlog"><rect x="16" y="440" width="328" height="110" rx="10" class="card"/><text x="28" y="468" class="title" text-anchor="start"><tspan x="28" dy="0">Board</tspan></text><text x="28" y="486" class="" text-anchor="start"><tspan x="28" dy="0">The backlog as cards in five lanes: Backlog,</tspan><tspan x="28" dy="16">Planned, Awaiting you, Running and Done. A card</tspan><tspan x="28" dy="16">opens the task, with its open questions to</tspan><tspan x="28" dy="16">answer.</tspan></text><path d="M325,458 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="run"><rect x="16" y="558" width="328" height="94" rx="10" class="card"/><text x="28" y="586" class="title" text-anchor="start"><tspan x="28" dy="0">Agents</tspan></text><text x="28" y="604" class="" text-anchor="start"><tspan x="28" dy="0">The runs and the queued tasks. Each step, the</tspan><tspan x="28" dy="16">agent's turns and the changes. The Approve step</tspan><tspan x="28" dy="16">merges through <tspan class="code">orc merge</tspan>.</tspan></text><path d="M325,576 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="quota"><rect x="16" y="660" width="328" height="78" rx="10" class="card"/><text x="28" y="688" class="title" text-anchor="start"><tspan x="28" dy="0">Resources</tspan></text><text x="28" y="706" class="" text-anchor="start"><tspan x="28" dy="0">Each account's quota windows. Each machine's</tspan><tspan x="28" dy="16">cores, load, memory, disk and running runs.</tspan></text><path d="M325,678 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="chat"><rect x="16" y="746" width="328" height="78" rx="10" class="card"/><text x="28" y="774" class="title" text-anchor="start"><tspan x="28" dy="0">The chat drawer</tspan></text><text x="28" y="792" class="" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">cmd-k</tspan> on any tab. The same <tspan class="code">orc chat</tspan> as in a</tspan><tspan x="28" dy="16">terminal, with the same eight tools.</tspan></text><path d="M325,764 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,839 L180,857" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,857) rotate(90)"/>
<rect x="4" y="860" width="352" height="224" rx="14" class="zone"/><text x="16" y="881" class="label" text-anchor="start"><tspan x="16" dy="0">The terminal</tspan></text>
<rect x="16" y="892" width="328" height="94" rx="10" class="card"/><text x="28" y="920" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc-dash</tspan></tspan></text><text x="28" y="938" class="" text-anchor="start"><tspan x="28" dy="0">The same facts as panels: quota, session quota,</tspan><tspan x="28" dy="16">resources, queues, schedules, dispatch,</tspan><tspan x="28" dy="16">attention, tasks, alerts and ledger.</tspan></text>
<g data-part="chat"><rect x="16" y="994" width="328" height="78" rx="10" class="card"/><text x="28" y="1022" class="title" text-anchor="start"><tspan x="28" dy="0">Its alert stream</tspan></text><text x="28" y="1040" class="" text-anchor="start"><tspan x="28" dy="0">It watches quota pace, machine load and long</tspan><tspan x="28" dy="16">tasks. The chat's alerts come from here.</tspan></text><path d="M325,1012 l5,5.5 l-5,5.5" class="line-work"/></g>
</svg>
