<path d="M742,514 L762,514" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(762,514) rotate(0)"/>
<path d="M148,556 L168,556 L168,579 L742,579 L742,544 L762,544" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(762,544) rotate(0)"/>
