<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" class="orc-d" role="img" aria-labelledby="how-orc-works-route-title how-orc-works-route-desc">
<title id="how-orc-works-route-title">How orc works: the route of one task</title>
<desc id="how-orc-works-route-desc">You describe the work. The backlog keeps it as one file per task. The beat picks what starts, on a machine with a free slot and an account with room. The runner queues it, an agent writes the change, the checks and a review judge it, and a pull request opens that you merge. A run's question waits in the attention queue, where a small model answers the routine ones from your rules and you answer the rest.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
</style>
<rect x="8" y="8" width="136" height="304" rx="14" class="zone"/>
<text x="20" y="29" class="label" text-anchor="start"><tspan x="20" dy="0">You</tspan></text>
<rect x="142.5" y="8" width="270.5" height="304" rx="14" class="zone"/>
<text x="154.5" y="29" class="label" text-anchor="start"><tspan x="154.5" dy="0">The machine that plans</tspan></text>
<rect x="411.5" y="8" width="405" height="304" rx="14" class="zone"/>
<text x="423.5" y="29" class="label" text-anchor="start"><tspan x="423.5" dy="0">A machine that works</tspan></text>
<rect x="815" y="8" width="136" height="304" rx="14" class="zone"/>
<text x="827" y="29" class="label" text-anchor="start"><tspan x="827" dy="0">GitHub</tspan></text>
<path d="M76,56 L941,56" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(941,56) rotate(0)"/>
<circle cx="76" cy="56" r="12" class="dot-work"/><text x="76" y="60.5" class="num" text-anchor="middle"><tspan x="76" dy="0">1</tspan></text>
<rect x="14" y="80" width="124" height="138" rx="10" class="card"/>
<text x="24" y="104" class="title" text-anchor="start"><tspan x="24" dy="0">You describe</tspan><tspan x="24" dy="18">the work</tspan></text>
<text x="24" y="150" class="" text-anchor="start"><tspan x="24" dy="0">in the chat, or</tspan><tspan x="24" dy="17">as a task file</tspan></text>
<circle cx="210.5" cy="56" r="12" class="dot-work"/><text x="210.5" y="60.5" class="num" text-anchor="middle"><tspan x="210.5" dy="0">2</tspan></text>
<rect x="148.5" y="80" width="124" height="138" rx="10" class="card"/>
<text x="158.5" y="104" class="title" text-anchor="start"><tspan x="158.5" dy="0">The backlog</tspan><tspan x="158.5" dy="18">keeps it</tspan></text>
<text x="158.5" y="150" class="" text-anchor="start"><tspan x="158.5" dy="0">one file per task,</tspan><tspan x="158.5" dy="17">in priority order</tspan></text>
<circle cx="345" cy="56" r="12" class="dot-work"/><text x="345" y="60.5" class="num" text-anchor="middle"><tspan x="345" dy="0">3</tspan></text>
<rect x="283" y="80" width="124" height="138" rx="10" class="card"/>
<text x="293" y="104" class="title" text-anchor="start"><tspan x="293" dy="0">The beat picks</tspan><tspan x="293" dy="18">what starts</tspan></text>
<text x="293" y="150" class="" text-anchor="start"><tspan x="293" dy="0">every few minutes:</tspan><tspan x="293" dy="17">a free machine, an</tspan><tspan x="293" dy="17">account with room</tspan></text>
<circle cx="479.5" cy="56" r="12" class="dot-work"/><text x="479.5" y="60.5" class="num" text-anchor="middle"><tspan x="479.5" dy="0">4</tspan></text>
<rect x="417.5" y="80" width="124" height="138" rx="10" class="card"/>
<text x="427.5" y="104" class="title" text-anchor="start"><tspan x="427.5" dy="0">The runner</tspan><tspan x="427.5" dy="18">queues it</tspan></text>
<text x="427.5" y="150" class="" text-anchor="start"><tspan x="427.5" dy="0">a queue on that</tspan><tspan x="427.5" dy="17">machine, a few</tspan><tspan x="427.5" dy="17">tasks at a time</tspan></text>
<circle cx="614" cy="56" r="12" class="dot-work"/><text x="614" y="60.5" class="num" text-anchor="middle"><tspan x="614" dy="0">5</tspan></text>
<rect x="552" y="80" width="124" height="138" rx="10" class="card"/>
<text x="562" y="104" class="title" text-anchor="start"><tspan x="562" dy="0">An agent writes</tspan><tspan x="562" dy="18">the change</tspan></text>
<text x="562" y="150" class="" text-anchor="start"><tspan x="562" dy="0">on its own copy</tspan><tspan x="562" dy="17">of the project,</tspan><tspan x="562" dy="17">on a new branch</tspan></text>
<circle cx="748.5" cy="56" r="12" class="dot-work"/><text x="748.5" y="60.5" class="num" text-anchor="middle"><tspan x="748.5" dy="0">6</tspan></text>
<rect x="686.5" y="80" width="124" height="138" rx="10" class="card"/>
<text x="696.5" y="104" class="title" text-anchor="start"><tspan x="696.5" dy="0">Checks, then</tspan><tspan x="696.5" dy="18">a review</tspan></text>
<text x="696.5" y="150" class="" text-anchor="start"><tspan x="696.5" dy="0">the agent fixes</tspan><tspan x="696.5" dy="17">what the checks</tspan><tspan x="696.5" dy="17">refuse</tspan></text>
<circle cx="883" cy="56" r="12" class="dot-work"/><text x="883" y="60.5" class="num" text-anchor="middle"><tspan x="883" dy="0">7</tspan></text>
<rect x="821" y="80" width="124" height="138" rx="10" class="card"/>
<text x="831" y="104" class="title" text-anchor="start"><tspan x="831" dy="0">A pull request</tspan><tspan x="831" dy="18">you merge</tspan></text>
<text x="831" y="150" class="" text-anchor="start"><tspan x="831" dy="0">opened after the</tspan><tspan x="831" dy="17">review, merged</tspan><tspan x="831" dy="17">once CI is green</tspan></text>
<rect x="283" y="250" width="124" height="50" rx="8" class="card-work"/>
<text x="345" y="271" class="" text-anchor="middle"><tspan x="345" dy="0">Quota: room left</tspan><tspan x="345" dy="16">on each account</tspan></text>
<path d="M345,250 L345,220" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(345,220) rotate(-90)"/>
<text x="14" y="352" class="ask-text" text-anchor="start"><tspan x="14" dy="0">When a run has a question it cannot settle</tspan></text>
<path d="M602,218 L602,370" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(602,370) rotate(90)"/>
<path d="M626,372 L626,220" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(626,220) rotate(-90)"/>
<text x="594" y="346" class="ask-text" text-anchor="end"><tspan x="594" dy="0">asks</tspan></text>
<text x="634" y="346" class="ask-text" text-anchor="start"><tspan x="634" dy="0">gets the answer</tspan></text>
<rect x="526" y="372" width="176" height="108" rx="10" class="card-ask"/>
<text x="538" y="398" class="title" text-anchor="start"><tspan x="538" dy="0">The attention queue</tspan></text>
<text x="538" y="422" class="" text-anchor="start"><tspan x="538" dy="0">every open question</tspan><tspan x="538" dy="17">waits here</tspan></text>
<path d="M526,426 L492,426" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(492,426) rotate(180)"/>
<rect x="290" y="372" width="200" height="108" rx="10" class="card-ask"/>
<text x="302" y="398" class="title" text-anchor="start"><tspan x="302" dy="0">A small model answers</tspan><tspan x="302" dy="18">the routine ones</tspan></text>
<text x="302" y="442" class="" text-anchor="start"><tspan x="302" dy="0">only by quoting a rule</tspan><tspan x="302" dy="17">you wrote</tspan></text>
<path d="M290,426 L256,426" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(256,426) rotate(180)"/>
<rect x="14" y="372" width="240" height="108" rx="10" class="card-ask"/>
<text x="26" y="398" class="title" text-anchor="start"><tspan x="26" dy="0">You answer the rest</tspan></text>
<text x="26" y="422" class="" text-anchor="start"><tspan x="26" dy="0">The chat tells you when a question</tspan><tspan x="26" dy="17">waits and when a task ends.</tspan></text>
<rect x="746" y="372" width="200" height="108" rx="10" class="card"/>
<text x="758" y="398" class="title" text-anchor="start"><tspan x="758" dy="0">The app and</tspan><tspan x="758" dy="18">the dashboard</tspan></text>
<text x="758" y="442" class="" text-anchor="start"><tspan x="758" dy="0">They show all of this,</tspan><tspan x="758" dy="17">and they only read.</tspan></text>
</svg>
