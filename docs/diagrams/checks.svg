<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" class="orc-d" role="img" aria-labelledby="d-checks-title d-checks-desc">
<title id="d-checks-title">Checks and review: the two gates a code change passes</title>
<desc id="d-checks-desc">After Pi commits, orc runs the project's checks. When one fails, a fixer repairs it and the checks run again, and after three fixes with a check still red the run fails and no pull request opens. Once the checks are green, no-mistakes reviews the branch. Orc has it fix a finding marked auto-fix, ignores no-op, and treats a finding marked ask-user or with any other action as a question that waits at the gate for 30 minutes before the task parks on its branch. After orc answers 20 gates without an outcome it asks gate-cap before it answers more. Then no-mistakes pushes the branch, opens the pull request and waits for green CI. The project's mode decides which of these a ship task goes through.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#fbe7ae, #4d3b12);
  --d-end-soft: light-dark(#d9d5cf, #45403b);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .card-end { fill: var(--d-end-soft); stroke: var(--d-mute); stroke-width: 1.5; }
.orc-d .line-aside { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .chevron { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .bar { fill: none; stroke: var(--d-mute); stroke-width: 3; stroke-linecap: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-aside { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="8" y="8" width="290" height="530" rx="14" class="zone"/><text x="20" y="29" class="label" text-anchor="start"><tspan x="20" dy="0">Gate 1: the project's checks</tspan></text>
<rect x="318" y="8" width="390" height="530" rx="14" class="zone"/><text x="330" y="29" class="label" text-anchor="start"><tspan x="330" dy="0">Gate 2: the review</tspan></text>
<rect x="728" y="8" width="224" height="530" rx="14" class="zone"/><text x="740" y="29" class="label" text-anchor="start"><tspan x="740" dy="0">A ship task, by the project's mode</tspan></text>
<g data-part="run"><rect x="18" y="42" width="270" height="80" rx="10" class="card"/><text x="30" y="70" class="title" text-anchor="start"><tspan x="30" dy="0">The branch</tspan></text><text x="30" y="88" class="" text-anchor="start"><tspan x="30" dy="0">Pi's commits, in the run's copy of the</tspan><tspan x="30" dy="16">project.</tspan></text><path d="M269,60 l5,5.5 l-5,5.5" class="chevron"/></g>
<rect x="18" y="150" width="270" height="80" rx="10" class="card"/><text x="30" y="178" class="title" text-anchor="start"><tspan x="30" dy="0">The checks</tspan></text><text x="30" y="196" class="" text-anchor="start"><tspan x="30" dy="0">The commands the project names in</tspan><tspan x="30" dy="16"><tspan class="code">.no-mistakes.yaml</tspan>.</tspan></text>
<rect x="18" y="282" width="270" height="96" rx="10" class="card"/><text x="30" y="310" class="title" text-anchor="start"><tspan x="30" dy="0">A fixer</tspan></text><text x="30" y="328" class="" text-anchor="start"><tspan x="30" dy="0">A second Pi gets the failing output and</tspan><tspan x="30" dy="16">repairs it. Then the checks run again.</tspan></text>
<rect x="18" y="404" width="270" height="78" rx="10" class="card-end"/><text x="30" y="432" class="title" text-anchor="start"><tspan x="30" dy="0">The run fails</tspan></text><text x="30" y="450" class="" text-anchor="start"><tspan x="30" dy="0">A check is still red after 3 fixes. No</tspan><tspan x="30" dy="16">pull request opens.</tspan></text>
<path d="M153,122 L153,148" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(153,148) rotate(90)"/>
<path d="M100,230 L100,280" class="line-aside"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-aside" transform="translate(100,280) rotate(90)"/>
<text x="92" y="260" class="" text-anchor="end"><tspan x="92" dy="0">red</tspan></text>
<path d="M206,280 L206,232" class="line-aside"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-aside" transform="translate(206,232) rotate(-90)"/>
<text x="214" y="260" class="" text-anchor="start"><tspan x="214" dy="0">again</tspan></text>
<path d="M153,378 L153,402" class="line-aside"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-aside" transform="translate(153,402) rotate(90)"/>
<rect x="328" y="42" width="350" height="78" rx="10" class="card"/><text x="340" y="70" class="title" text-anchor="start"><tspan x="340" dy="0">no-mistakes reviews the branch</tspan></text><text x="340" y="88" class="" text-anchor="start"><tspan x="340" dy="0">It gets the task as its intent, and marks each</tspan><tspan x="340" dy="16">finding.</tspan></text>
<rect x="328" y="144" width="350" height="122" rx="10" class="card"/><text x="340" y="172" class="title" text-anchor="start"><tspan x="340" dy="0">What orc does with a finding</tspan></text><circle cx="343" cy="190" r="2" class="dot-mute-strong"/><text x="352" y="194" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">auto-fix</tspan>: asks no-mistakes to fix it</tspan></text><circle cx="343" cy="208" r="2" class="dot-mute-strong"/><text x="352" y="212" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">no-op</tspan>: ignores it</tspan></text><circle cx="343" cy="226" r="2" class="dot-mute-strong"/><text x="352" y="230" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">ask-user</tspan> or any other action: a question that</tspan><tspan x="352" dy="16">waits for an answer</tspan></text>
<g data-part="attention"><rect x="328" y="292" width="350" height="128" rx="10" class="card-ask"/><text x="340" y="320" class="title" text-anchor="start"><tspan x="340" dy="0">A question waits at the gate</tspan></text><text x="340" y="338" class="" text-anchor="start"><tspan x="340" dy="0">For 30 minutes. An answer in that time carries the</tspan><tspan x="340" dy="16">run on. With none, the task parks on its branch,</tspan><tspan x="340" dy="16">and resumes once every question has an answer.</tspan><tspan x="340" dy="16">After 20 gates without an outcome orc asks gate-cap</tspan><tspan x="340" dy="16">and waits the same way.</tspan></text><path d="M659,310 l5,5.5 l-5,5.5" class="chevron"/></g>
<rect x="328" y="446" width="350" height="80" rx="10" class="card"/><text x="340" y="474" class="title" text-anchor="start"><tspan x="340" dy="0">no-mistakes delivers</tspan></text><text x="340" y="492" class="" text-anchor="start"><tspan x="340" dy="0">It pushes the branch, opens the pull request and</tspan><tspan x="340" dy="16">waits for green CI.</tspan></text>
<path d="M288,190 L303,190 L303,76 L326,76" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(326,76) rotate(0)"/>
<text x="298" y="140" class="" text-anchor="end"><tspan x="298" dy="0">green</tspan></text>
<path d="M503,120 L503,142" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(503,142) rotate(90)"/>
<path d="M430,266 L430,290" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(430,290) rotate(90)"/>
<path d="M503,420 L503,444" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(503,444) rotate(90)"/>
<path d="M678,196 L692,196 L692,468 L680,468" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(680,468) rotate(180)"/>
<rect x="738" y="42" width="204" height="96" rx="10" class="card"/><text x="750" y="70" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">no-mistakes</tspan></tspan></text><text x="750" y="88" class="" text-anchor="start"><tspan x="750" dy="0">The default. Checks, then</tspan><tspan x="750" dy="16">the review, then a pull</tspan><tspan x="750" dy="16">request with green CI.</tspan></text>
<rect x="738" y="146" width="204" height="96" rx="10" class="card"/><text x="750" y="174" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">direct-PR</tspan></tspan></text><text x="750" y="192" class="" text-anchor="start"><tspan x="750" dy="0">Checks, then orc pushes the</tspan><tspan x="750" dy="16">branch and opens the pull</tspan><tspan x="750" dy="16">request itself.</tspan></text>
<rect x="738" y="250" width="204" height="96" rx="10" class="card"/><text x="750" y="278" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">no-mistakes-prod-only</tspan></tspan></text><text x="750" y="296" class="" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">direct-PR</tspan> for a task marked</tspan><tspan x="750" dy="16">internal, <tspan class="code">no-mistakes</tspan> for</tspan><tspan x="750" dy="16">the rest.</tspan></text>
<g data-part="merge"><rect x="738" y="432" width="204" height="96" rx="10" class="card-ok"/><text x="750" y="460" class="title" text-anchor="start"><tspan x="750" dy="0">A pull request</tspan></text><text x="750" y="478" class="" text-anchor="start"><tspan x="750" dy="0">A code change, checked</tspan><tspan x="750" dy="16">before it reaches you.</tspan><tspan x="750" dy="16">Delivery may include review.</tspan></text><path d="M923,450 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M678,504 L736,504" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(736,504) rotate(0)"/>
</svg>
