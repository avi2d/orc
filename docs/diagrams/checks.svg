<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498" class="orc-d" role="img" aria-labelledby="d-checks-title d-checks-desc">
<title id="d-checks-title">Checks and review: the two gates a code change passes</title>
<desc id="d-checks-desc">After Pi commits, orc runs the project's checks. When one fails, a fixer repairs it and the checks run again, and after three fixes with a check still red the run fails and no pull request opens. Once the checks are green, no-mistakes reviews the branch. Orc has it fix a finding marked auto-fix, ignores no-op, and treats ask-user as a question that waits at the gate for 30 minutes before the task parks on its branch. Then no-mistakes pushes the branch, opens the pull request and waits for green CI. The project's mode decides which of these a ship task goes through.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-work-soft: light-dark(#f7e6de, #342019);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#ede4d3, #3b2d1a);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .mark-running, .orc-d .mark-failed { color: var(--d-work); }
.orc-d .mark-waiting { color: var(--d-mute); }
.orc-d .mark-done { color: var(--d-ok); }
.orc-d .mark-attention { color: var(--d-ask); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="8" y="8" width="290" height="482" rx="14" class="zone"/><text x="20" y="29" class="label" text-anchor="start"><tspan x="20" dy="0">Gate 1: the project's checks</tspan></text>
<rect x="318" y="8" width="390" height="482" rx="14" class="zone"/><text x="330" y="29" class="label" text-anchor="start"><tspan x="330" dy="0">Gate 2: the review</tspan></text>
<rect x="728" y="8" width="224" height="482" rx="14" class="zone"/><text x="740" y="29" class="label" text-anchor="start"><tspan x="740" dy="0">A ship task, by the project's mode</tspan></text>
<g data-part="run"><rect x="18" y="42" width="270" height="80" rx="10" class="card"/><text x="30" y="70" class="title" text-anchor="start"><tspan x="30" dy="0">The branch</tspan></text><text x="30" y="88" class="" text-anchor="start"><tspan x="30" dy="0">Pi's commits, in the run's copy of the</tspan><tspan x="30" dy="16">project.</tspan></text><path d="M269,60 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="18" y="150" width="270" height="80" rx="10" class="card-work"/><text x="30" y="178" class="title" text-anchor="start"><tspan x="30" dy="0">The checks</tspan></text><text x="30" y="196" class="" text-anchor="start"><tspan x="30" dy="0">The commands the project names in</tspan><tspan x="30" dy="16"><tspan class="code">.no-mistakes.yaml</tspan>.</tspan></text>
<rect x="18" y="282" width="270" height="96" rx="10" class="card"/><text x="30" y="310" class="title" text-anchor="start"><tspan x="30" dy="0">A fixer</tspan></text><text x="30" y="328" class="" text-anchor="start"><tspan x="30" dy="0">A second Pi gets the failing output and</tspan><tspan x="30" dy="16">repairs it. Then the checks run again.</tspan></text>
<rect x="18" y="404" width="270" height="78" rx="10" class="card"/><text x="30" y="432" class="title" text-anchor="start"><tspan x="30" dy="0">The run fails</tspan></text><text x="30" y="450" class="" text-anchor="start"><tspan x="30" dy="0">A check is still red after 3 fixes. No</tspan><tspan x="30" dy="16">pull request opens.</tspan></text><svg x="136.10000000000002" y="419" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-failed" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
<path d="M153,122 L153,148" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(153,148) rotate(90)"/>
<path d="M100,230 L100,280" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(100,280) rotate(90)"/>
<text x="92" y="260" class="" text-anchor="end"><tspan x="92" dy="0">red</tspan></text>
<path d="M206,280 L206,232" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(206,232) rotate(-90)"/>
<text x="214" y="260" class="" text-anchor="start"><tspan x="214" dy="0">again</tspan></text>
<path d="M153,378 L153,402" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(153,402) rotate(90)"/>
<rect x="328" y="42" width="350" height="78" rx="10" class="card-work"/><text x="340" y="70" class="title" text-anchor="start"><tspan x="340" dy="0">no-mistakes reviews the branch</tspan></text><text x="340" y="88" class="" text-anchor="start"><tspan x="340" dy="0">It gets the task as its intent, and marks each</tspan><tspan x="340" dy="16">finding.</tspan></text>
<rect x="328" y="144" width="350" height="106" rx="10" class="card"/><text x="340" y="172" class="title" text-anchor="start"><tspan x="340" dy="0">What orc does with a finding</tspan></text><circle cx="343" cy="190" r="2" class="dot-mute-strong"/><text x="352" y="194" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">auto-fix</tspan>: asks no-mistakes to fix it</tspan></text><circle cx="343" cy="208" r="2" class="dot-mute-strong"/><text x="352" y="212" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">no-op</tspan>: ignores it</tspan></text><circle cx="343" cy="226" r="2" class="dot-mute-strong"/><text x="352" y="230" class="" text-anchor="start"><tspan x="352" dy="0"><tspan class="code">ask-user</tspan>: a question that waits for an answer</tspan></text>
<g data-part="attention"><rect x="328" y="276" width="350" height="96" rx="10" class="card-ask"/><text x="340" y="304" class="title" text-anchor="start"><tspan x="340" dy="0">A question waits at the gate</tspan></text><text x="340" y="322" class="" text-anchor="start"><tspan x="340" dy="0">For 30 minutes. An answer in that time carries the</tspan><tspan x="340" dy="16">run on. With none, the task parks on its branch,</tspan><tspan x="340" dy="16">and resumes once every question has an answer.</tspan></text><svg x="561.6" y="291" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-attention" aria-hidden="true"><path fill-rule="evenodd" d="M12 1C5.5 1 1 5.5 1 11.5C1 14.3 2 16 3.2 17.6L1.7 21.2Q1 23 3.1 22.2L7.2 20.5C8.5 21.2 10.3 22 12 22C18.5 22 23 17.5 23 11.5S18.5 1 12 1ZM10.3 5.3A1.7 1.7 0 0 1 13.7 5.3V12A1.7 1.7 0 0 1 10.3 12ZM12 15.5A1.7 1.7 0 1 0 12 18.9A1.7 1.7 0 1 0 12 15.5Z"/></svg><path d="M659,294 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="328" y="398" width="350" height="80" rx="10" class="card"/><text x="340" y="426" class="title" text-anchor="start"><tspan x="340" dy="0">no-mistakes delivers</tspan></text><text x="340" y="444" class="" text-anchor="start"><tspan x="340" dy="0">It pushes the branch, opens the pull request and</tspan><tspan x="340" dy="16">waits for green CI.</tspan></text>
<path d="M288,190 L303,190 L303,76 L326,76" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(326,76) rotate(0)"/>
<text x="298" y="140" class="" text-anchor="end"><tspan x="298" dy="0">green</tspan></text>
<path d="M503,120 L503,142" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(503,142) rotate(90)"/>
<path d="M430,250 L430,274" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(430,274) rotate(90)"/>
<path d="M503,372 L503,396" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(503,396) rotate(90)"/>
<path d="M678,196 L692,196 L692,420 L680,420" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(680,420) rotate(180)"/>
<rect x="738" y="42" width="204" height="96" rx="10" class="card"/><text x="750" y="70" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">no-mistakes</tspan></tspan></text><text x="750" y="88" class="" text-anchor="start"><tspan x="750" dy="0">The default. Checks, then</tspan><tspan x="750" dy="16">the review, then a pull</tspan><tspan x="750" dy="16">request with green CI.</tspan></text>
<rect x="738" y="146" width="204" height="96" rx="10" class="card"/><text x="750" y="174" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">direct-PR</tspan></tspan></text><text x="750" y="192" class="" text-anchor="start"><tspan x="750" dy="0">Checks, then orc pushes the</tspan><tspan x="750" dy="16">branch and opens the pull</tspan><tspan x="750" dy="16">request itself.</tspan></text>
<rect x="738" y="250" width="204" height="96" rx="10" class="card"/><text x="750" y="278" class="title" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">no-mistakes-prod-only</tspan></tspan></text><text x="750" y="296" class="" text-anchor="start"><tspan x="750" dy="0"><tspan class="code">direct-PR</tspan> for a task marked</tspan><tspan x="750" dy="16">internal, <tspan class="code">no-mistakes</tspan> for</tspan><tspan x="750" dy="16">the rest.</tspan></text>
<g data-part="merge"><rect x="738" y="384" width="204" height="96" rx="10" class="card-ok"/><text x="750" y="412" class="title" text-anchor="start"><tspan x="750" dy="0">A pull request</tspan></text><text x="750" y="430" class="" text-anchor="start"><tspan x="750" dy="0">A code change, checked</tspan><tspan x="750" dy="16">before it reaches you.</tspan><tspan x="750" dy="16">Delivery may include review.</tspan></text><svg x="863.8" y="399" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-done" aria-hidden="true"><path d="M4 12L9 17L20 5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><path d="M923,402 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M678,456 L736,456" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(736,456) rotate(0)"/>
</svg>
