<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1276" class="orc-d" role="img" aria-labelledby="d-backlog-tall-title d-backlog-tall-desc">
<title id="d-backlog-tall-title">The backlog: where a task file sits, and how it moves</title>
<desc id="d-backlog-tall-desc">You add a task in the chat or with orc backlog add. Its file sits in the folder new until a beat takes it, then in taken while its run is queued or running, then in closed with its outcome. A run that stops on a question sends the task back to new, and so does orc backlog send-back. The kind of a task, ship, scout, task, parent or decision, decides how it ends.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="192" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">You</tspan></text>
<g data-part="chat"><rect x="16" y="36" width="328" height="62" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">Add a task</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">Say it in the chat, or run <tspan class="code">orc backlog add</tspan>.</tspan></text><path d="M325,54 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="16" y="106" width="328" height="78" rx="10" class="card"/><text x="28" y="134" class="title" text-anchor="start"><tspan x="28" dy="0">Change your mind</tspan></text><text x="28" y="152" class="" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc backlog drop</tspan> closes a task that has not</tspan><tspan x="28" dy="16">started.</tspan></text>
<path d="M180,199 L180,217" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,217) rotate(90)"/>
<rect x="4" y="220" width="352" height="562" rx="14" class="zone"/><text x="16" y="241" class="label" text-anchor="start"><tspan x="16" dy="0">The folder a task file sits in is its state</tspan></text>
<rect x="16" y="252" width="328" height="194" rx="10" class="card-work"/><text x="28" y="280" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">new</tspan></tspan></text><text x="28" y="298" class="" text-anchor="start"><tspan x="28" dy="0">Waiting to start, in priority order. It waits</tspan><tspan x="28" dy="16">while:</tspan></text><circle cx="31" cy="336" r="2" class="dot-mute-strong"/><text x="40" y="340" class="" text-anchor="start"><tspan x="40" dy="0">it has no priority</tspan></text><circle cx="31" cy="354" r="2" class="dot-mute-strong"/><text x="40" y="358" class="" text-anchor="start"><tspan x="40" dy="0">you hold it</tspan></text><circle cx="31" cy="372" r="2" class="dot-mute-strong"/><text x="40" y="376" class="" text-anchor="start"><tspan x="40" dy="0">a question has no answer</tspan></text><circle cx="31" cy="390" r="2" class="dot-mute-strong"/><text x="40" y="394" class="" text-anchor="start"><tspan x="40" dy="0">it depends on an open task</tspan></text><circle cx="31" cy="408" r="2" class="dot-mute-strong"/><text x="40" y="412" class="" text-anchor="start"><tspan x="40" dy="0">no machine has a free slot</tspan></text><circle cx="31" cy="426" r="2" class="dot-mute-strong"/><text x="40" y="430" class="" text-anchor="start"><tspan x="40" dy="0">no account has room</tspan></text>
<path d="M180,448 L180,468" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,468) rotate(90)"/>
<text x="192" y="462" class="" text-anchor="start"><tspan x="192" dy="0">a beat takes it</tspan></text>
<g data-part="beat"><rect x="16" y="470" width="328" height="78" rx="10" class="card"/><text x="28" y="498" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">taken</tspan></tspan></text><text x="28" y="516" class="" text-anchor="start"><tspan x="28" dy="0">A beat took it. Its run is queued or running on</tspan><tspan x="28" dy="16">a machine.</tspan></text><path d="M325,488 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,550 L180,570" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,570) rotate(90)"/>
<text x="192" y="564" class="" text-anchor="start"><tspan x="192" dy="0">the run ends</tspan></text>
<rect x="16" y="572" width="328" height="142" rx="10" class="card"/><text x="28" y="600" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">closed</tspan></tspan></text><text x="28" y="618" class="" text-anchor="start"><tspan x="28" dy="0">It keeps its outcome and the reason:</tspan></text><circle cx="31" cy="640" r="2" class="dot-mute-strong"/><text x="40" y="644" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">done</tspan>, with a pull request or a report</tspan></text><circle cx="31" cy="658" r="2" class="dot-mute-strong"/><text x="40" y="662" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">failed</tspan> or <tspan class="code">start-failed</tspan></tspan></text><circle cx="31" cy="676" r="2" class="dot-mute-strong"/><text x="40" y="680" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">stopped</tspan></tspan></text><circle cx="31" cy="694" r="2" class="dot-mute-strong"/><text x="40" y="698" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">dropped</tspan></tspan></text>
<text x="20" y="732" class="ask-text" text-anchor="start"><tspan x="20" dy="0">A run that stops on a question sends its task back</tspan><tspan x="20" dy="16">to <tspan class="code">new</tspan>. So does <tspan class="code">orc backlog send-back</tspan>, for one</tspan><tspan x="20" dy="16">more pass on a pull request.</tspan></text>
<path d="M180,785 L180,803" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,803) rotate(90)"/>
<rect x="4" y="806" width="352" height="466" rx="14" class="zone"/><text x="16" y="827" class="label" text-anchor="start"><tspan x="16" dy="0">The kind of a task decides how it ends</tspan></text>
<rect x="16" y="838" width="328" height="78" rx="10" class="card"/><text x="28" y="866" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">ship</tspan></tspan></text><text x="28" y="884" class="" text-anchor="start"><tspan x="28" dy="0">The default. Changes code and ends in a pull</tspan><tspan x="28" dy="16">request.</tspan></text>
<rect x="16" y="924" width="328" height="78" rx="10" class="card"/><text x="28" y="952" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">scout</tspan></tspan></text><text x="28" y="970" class="" text-anchor="start"><tspan x="28" dy="0">Reads the project and changes nothing. Ends in a</tspan><tspan x="28" dy="16">report.</tspan></text>
<rect x="16" y="1010" width="328" height="78" rx="10" class="card"/><text x="28" y="1038" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">task</tspan></tspan></text><text x="28" y="1056" class="" text-anchor="start"><tspan x="28" dy="0">Does the work it describes. Ends in a report</tspan><tspan x="28" dy="16">with its evidence.</tspan></text>
<rect x="16" y="1096" width="328" height="78" rx="10" class="card"/><text x="28" y="1124" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">parent</tspan></tspan></text><text x="28" y="1142" class="" text-anchor="start"><tspan x="28" dy="0">Holds work too large for one pull request. Ends</tspan><tspan x="28" dy="16">once its children are done.</tspan></text>
<rect x="16" y="1182" width="328" height="78" rx="10" class="card"/><text x="28" y="1210" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">decision</tspan></tspan></text><text x="28" y="1228" class="" text-anchor="start"><tspan x="28" dy="0">Asks you a question and never runs. Ends with</tspan><tspan x="28" dy="16">your answer.</tspan></text>
</svg>
