<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498" class="orc-d" role="img" aria-labelledby="d-run-title d-run-desc">
<title id="d-run-title">A run: one attempt at one task</title>
<desc id="d-run-desc">The runner starts most runs, and you can start one by hand. A run makes a copy of the project on a new branch, runs the prepare command, and starts the Pi agent, which writes the change and commits it. The project's checks run, a fixer repairs what failed up to three times, and the run delivers a pull request or a report. Orc watches Pi while it works, and keeps the record of every run in its own folder.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="8" y="8" width="170" height="482" rx="14" class="zone"/><text x="20" y="29" class="label" text-anchor="start"><tspan x="20" dy="0">Who starts it</tspan></text>
<rect x="198" y="8" width="754" height="230" rx="14" class="zone"/><text x="210" y="29" class="label" text-anchor="start"><tspan x="210" dy="0">The run, on a machine that works</tspan></text>
<rect x="198" y="252" width="440" height="238" rx="14" class="zone"/><text x="210" y="273" class="label" text-anchor="start"><tspan x="210" dy="0">Orc watches Pi while it works</tspan></text>
<rect x="658" y="252" width="294" height="238" rx="14" class="zone"/><text x="670" y="273" class="label" text-anchor="start"><tspan x="670" dy="0">The record</tspan></text>
<g data-part="runner"><rect x="18" y="42" width="150" height="120" rx="10" class="card"/><text x="30" y="70" class="title" text-anchor="start"><tspan x="30" dy="0">The runner</tspan></text><text x="30" y="88" class="" text-anchor="start"><tspan x="30" dy="0">The beat starts most</tspan><tspan x="30" dy="16">runs through it, on</tspan><tspan x="30" dy="16">the host.</tspan></text><path d="M149,60 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="18" y="176" width="150" height="170" rx="10" class="card"/><text x="30" y="204" class="title" text-anchor="start"><tspan x="30" dy="0">You, by hand</tspan></text><text x="30" y="222" class="" text-anchor="start"><tspan x="30" dy="0"><tspan class="code">orc run</tspan></tspan><tspan x="30" dy="16"><tspan class="code">&lt;task-file></tspan> in a</tspan><tspan x="30" dy="16">clean checkout. It</tspan><tspan x="30" dy="16">works inside the</tspan><tspan x="30" dy="16">nono sandbox unless</tspan><tspan x="30" dy="16">you say otherwise.</tspan></text>
<rect x="208" y="42" width="134" height="186" rx="10" class="card"/><circle cx="231" cy="65" r="11" class="dot-work"/><text x="231" y="69.5" class="num" text-anchor="middle"><tspan x="231" dy="0">1</tspan></text><text x="248" y="70" class="title" text-anchor="start"><tspan x="248" dy="0">A copy</tspan></text><text x="220" y="88" class="" text-anchor="start"><tspan x="220" dy="0">A git worktree on</tspan><tspan x="220" dy="16">a new branch,</tspan><tspan x="220" dy="16">under</tspan><tspan x="220" dy="16"><tspan class="code">~/.orc/worktrees</tspan>.</tspan><tspan x="220" dy="16">Your own checkout</tspan><tspan x="220" dy="16">is never touched.</tspan></text>
<rect x="358" y="42" width="134" height="186" rx="10" class="card"/><circle cx="381" cy="65" r="11" class="dot-work"/><text x="381" y="69.5" class="num" text-anchor="middle"><tspan x="381" dy="0">2</tspan></text><text x="398" y="70" class="title" text-anchor="start"><tspan x="398" dy="0">Prepare</tspan></text><text x="370" y="88" class="" text-anchor="start"><tspan x="370" dy="0">The project's</tspan><tspan x="370" dy="16"><tspan class="code">prepare</tspan> command,</tspan><tspan x="370" dy="16">such as an</tspan><tspan x="370" dy="16">install.</tspan></text>
<rect x="508" y="42" width="134" height="186" rx="10" class="card"/><circle cx="531" cy="65" r="11" class="dot-work"/><text x="531" y="69.5" class="num" text-anchor="middle"><tspan x="531" dy="0">3</tspan></text><text x="548" y="70" class="title" text-anchor="start"><tspan x="548" dy="0">Pi works</tspan></text><text x="520" y="88" class="" text-anchor="start"><tspan x="520" dy="0">The agent writes</tspan><tspan x="520" dy="16">the change,</tspan><tspan x="520" dy="16">commits it, and</tspan><tspan x="520" dy="16">prints</tspan><tspan x="520" dy="16"><tspan class="code">ORC_COMPLETE</tspan>.</tspan></text>
<g data-part="checks"><rect x="658" y="42" width="134" height="186" rx="10" class="card"/><circle cx="681" cy="65" r="11" class="dot-work"/><text x="681" y="69.5" class="num" text-anchor="middle"><tspan x="681" dy="0">4</tspan></text><text x="698" y="70" class="title" text-anchor="start"><tspan x="698" dy="0">Checks</tspan></text><text x="670" y="88" class="" text-anchor="start"><tspan x="670" dy="0">The project's own</tspan><tspan x="670" dy="16">checks. A fixer</tspan><tspan x="670" dy="16">repairs what</tspan><tspan x="670" dy="16">failed, up to</tspan><tspan x="670" dy="16">three times.</tspan></text><path d="M773,60 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="checks"><rect x="808" y="42" width="134" height="186" rx="10" class="card"/><circle cx="831" cy="65" r="11" class="dot-work"/><text x="831" y="69.5" class="num" text-anchor="middle"><tspan x="831" dy="0">5</tspan></text><text x="848" y="70" class="title" text-anchor="start"><tspan x="848" dy="0">Deliver</tspan></text><text x="820" y="88" class="" text-anchor="start"><tspan x="820" dy="0">Review, push,</tspan><tspan x="820" dy="16">pull request. A</tspan><tspan x="820" dy="16">report run writes</tspan><tspan x="820" dy="16"><tspan class="code">agent-report.md</tspan></tspan><tspan x="820" dy="16">instead.</tspan></text><path d="M923,60 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M342,100 L356,100" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(356,100) rotate(0)"/>
<path d="M492,100 L506,100" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(506,100) rotate(0)"/>
<path d="M642,100 L656,100" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(656,100) rotate(0)"/>
<path d="M792,100 L806,100" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(806,100) rotate(0)"/>
<g data-part="attention"><rect x="208" y="286" width="420" height="194" rx="10" class="card-ask"/><text x="220" y="314" class="title" text-anchor="start"><tspan x="220" dy="0">What orc does about it</tspan></text><circle cx="223" cy="332" r="2" class="dot-mute-strong"/><text x="232" y="336" class="" text-anchor="start"><tspan x="232" dy="0">Pi prints nothing for 45 minutes with no tool running: orc</tspan><tspan x="232" dy="16">stops it.</tspan></text><circle cx="223" cy="366" r="2" class="dot-mute-strong"/><text x="232" y="370" class="" text-anchor="start"><tspan x="232" dy="0">Pi fails one command 3 times in a row: you are told.</tspan></text><circle cx="223" cy="384" r="2" class="dot-mute-strong"/><text x="232" y="388" class="" text-anchor="start"><tspan x="232" dy="0">Pi fails it 6 times in a row: orc stops Pi and asks you</tspan><tspan x="232" dy="16">whether to continue.</tspan></text><circle cx="223" cy="418" r="2" class="dot-mute-strong"/><text x="232" y="422" class="" text-anchor="start"><tspan x="232" dy="0">Pi is unsure: it asks you a question instead of guessing.</tspan></text><path d="M609,304 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="668" y="286" width="274" height="96" rx="10" class="card"/><text x="680" y="314" class="title" text-anchor="start"><tspan x="680" dy="0"><tspan class="code">~/.orc/runs/&lt;run-id></tspan></tspan></text><text x="680" y="332" class="" text-anchor="start"><tspan x="680" dy="0">The task, the logs, the Pi session and</tspan><tspan x="680" dy="16"><tspan class="code">report.md</tspan>. Read it with <tspan class="code">orc runs</tspan>, <tspan class="code">orc</tspan></tspan><tspan x="680" dy="16"><tspan class="code">show</tspan> and <tspan class="code">orc log</tspan>.</tspan></text>
<rect x="668" y="388" width="274" height="94" rx="10" class="card"/><text x="680" y="416" class="title" text-anchor="start"><tspan x="680" dy="0">Resume</tspan></text><text x="680" y="434" class="" text-anchor="start"><tspan x="680" dy="0"><tspan class="code">orc run --branch &lt;name></tspan> skips the</tspan><tspan x="680" dy="16">steps that passed, and Pi resumes its</tspan><tspan x="680" dy="16">session.</tspan></text>
<path d="M168,90 L206,90" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(206,90) rotate(0)"/>
<path d="M575,228 L575,284" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(575,284) rotate(90)"/>
<path d="M875,228 L875,284" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(875,284) rotate(90)"/>
</svg>
