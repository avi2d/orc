<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1112" class="orc-d" role="img" aria-labelledby="d-beat-tall-title d-beat-tall-desc">
<title id="d-beat-tall-title">The beat: what lets a task start</title>
<desc id="d-beat-tall-desc">A beat is one pass of orc beat, which cron or launchd runs every few minutes. It takes the new tasks in priority order. A task starts once it has a priority, nothing open waits on it, everything it depends on is done, a machine with its checkout has a free slot, and an account has room. Otherwise it waits for the next beat. Every beat also closes finished runs, parks and resumes tasks, passes questions and answers, and watches runs and pull requests.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-work-soft: light-dark(#f7e6de, #342019);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#ede4d3, #3b2d1a);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .mark-running, .orc-d .mark-failed { color: var(--d-work); }
.orc-d .mark-waiting { color: var(--d-mute); }
.orc-d .mark-done { color: var(--d-ok); }
.orc-d .mark-attention { color: var(--d-ask); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="614" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">A new task starts once all five hold</tspan></text>
<rect x="16" y="36" width="328" height="62" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">A priority</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">Priority 0 goes first, then the oldest task.</tspan></text>
<rect x="16" y="106" width="328" height="62" rx="10" class="card"/><text x="28" y="134" class="title" text-anchor="start"><tspan x="28" dy="0">Nothing open</tspan></text><text x="28" y="152" class="" text-anchor="start"><tspan x="28" dy="0">No hold, and no question without an answer.</tspan></text>
<rect x="16" y="176" width="328" height="78" rx="10" class="card"/><text x="28" y="204" class="title" text-anchor="start"><tspan x="28" dy="0">Nothing ahead</tspan></text><text x="28" y="222" class="" text-anchor="start"><tspan x="28" dy="0">Each task it depends on closed done. A ship task</tspan><tspan x="28" dy="16">also waits for their pull requests to merge.</tspan></text>
<g data-part="runner"><rect x="16" y="262" width="328" height="62" rx="10" class="card"/><text x="28" y="290" class="title" text-anchor="start"><tspan x="28" dy="0">A free slot</tspan></text><text x="28" y="308" class="" text-anchor="start"><tspan x="28" dy="0">On a machine that holds the project's checkout.</tspan></text><path d="M325,280 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="quota"><rect x="16" y="332" width="328" height="62" rx="10" class="card"/><text x="28" y="360" class="title" text-anchor="start"><tspan x="28" dy="0">Room</tspan></text><text x="28" y="378" class="" text-anchor="start"><tspan x="28" dy="0">An account above 0% and at or above the floor.</tspan></text><path d="M325,350 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,396 L180,416" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,416) rotate(90)"/>
<text x="192" y="410" class="" text-anchor="start"><tspan x="192" dy="0">all five hold</tspan></text>
<g data-part="runner"><rect x="16" y="418" width="328" height="78" rx="10" class="card-ok"/><text x="28" y="446" class="title" text-anchor="start"><tspan x="28" dy="0">It starts</tspan></text><text x="28" y="464" class="" text-anchor="start"><tspan x="28" dy="0">The beat takes the task and runs the machine's</tspan><tspan x="28" dy="16">start command.</tspan></text><svg x="302" y="433" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-running" aria-hidden="true"><path d="M10 4.5Q10 2.7 11.7 3.7L22 10.3Q24 11.7 22 13.1L11.7 20Q10 21 10 19.2Z"/></svg><path d="M325,436 l5,5.5 l-5,5.5" class="line-work"/></g>
<text x="20" y="514" class="ask-text" text-anchor="start"><tspan x="20" dy="0">If one does not hold:</tspan></text>
<rect x="16" y="528" width="328" height="78" rx="10" class="card"/><text x="28" y="556" class="title" text-anchor="start"><tspan x="28" dy="0">It waits for the next beat</tspan></text><text x="28" y="574" class="" text-anchor="start"><tspan x="28" dy="0">The beat prints <tspan class="code">waits &lt;task-id>:</tspan> with the</tspan><tspan x="28" dy="16">reason. A decision never starts.</tspan></text><svg x="316" y="543" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-waiting" aria-hidden="true"><rect x="5" y="3" width="5" height="18" rx="2.5"/><rect x="14" y="3" width="5" height="18" rx="2.5"/></svg>
<path d="M180,621 L180,639" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,639) rotate(90)"/>
<rect x="4" y="642" width="352" height="466" rx="14" class="zone"/><text x="16" y="663" class="label" text-anchor="start"><tspan x="16" dy="0">Every beat also does this</tspan></text>
<rect x="16" y="674" width="328" height="78" rx="10" class="card"/><text x="28" y="702" class="title" text-anchor="start"><tspan x="28" dy="0">Runs on a clock</tspan></text><text x="28" y="720" class="" text-anchor="start"><tspan x="28" dy="0">Cron or launchd runs <tspan class="code">orc beat</tspan> every few</tspan><tspan x="28" dy="16">minutes. Orc has no daemon.</tspan></text>
<g data-part="backlog"><rect x="16" y="760" width="328" height="78" rx="10" class="card"/><text x="28" y="788" class="title" text-anchor="start"><tspan x="28" dy="0">Closes runs</tspan></text><text x="28" y="806" class="" text-anchor="start"><tspan x="28" dy="0">Done, failed or stopped, as <tspan class="code">orc runner result</tspan></tspan><tspan x="28" dy="16">says.</tspan></text><path d="M325,778 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="16" y="846" width="328" height="78" rx="10" class="card"/><text x="28" y="874" class="title" text-anchor="start"><tspan x="28" dy="0">Parks and resumes</tspan></text><text x="28" y="892" class="" text-anchor="start"><tspan x="28" dy="0">Parks a task whose run stopped on a question.</tspan><tspan x="28" dy="16">Resumes it once you answer.</tspan></text>
<g data-part="attention"><rect x="16" y="932" width="328" height="78" rx="10" class="card"/><text x="28" y="960" class="title" text-anchor="start"><tspan x="28" dy="0">Carries questions</tspan></text><text x="28" y="978" class="" text-anchor="start"><tspan x="28" dy="0">Opens attention items, gives the decider its</tspan><tspan x="28" dy="16">questions, hands answers to a waiting run.</tspan></text><path d="M325,950 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="16" y="1018" width="328" height="78" rx="10" class="card"/><text x="28" y="1046" class="title" text-anchor="start"><tspan x="28" dy="0">Watches</tspan></text><text x="28" y="1064" class="" text-anchor="start"><tspan x="28" dy="0">Flags a run silent for 30 minutes. Records when</tspan><tspan x="28" dy="16">a pull request turns green or merges.</tspan></text>
</svg>
