<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" class="orc-d" role="img" aria-labelledby="how-orc-works-map-title how-orc-works-map-desc">
<title id="how-orc-works-map-title">How orc works: where each part lives</title>
<desc id="how-orc-works-map-desc">You describe the work. The backlog keeps it as one file per task. The beat picks what starts, on a machine with a free slot and an account with room. The runner queues it, an agent writes the change, the checks and a review judge it, and a pull request opens that you merge. A run's question waits in the attention queue, where a small model answers the routine ones from your rules and you answer the rest.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#1f2328, #e8eaed);
  --d-mute: light-dark(#57606a, #a3abb5);
  --d-line: light-dark(#c8cdd5, #474d57);
  --d-card: light-dark(#ffffff, #22252b);
  --d-zone: light-dark(#f3f4f6, #17191d);
  --d-work: light-dark(#3451b2, #a8b1ff);
  --d-work-soft: light-dark(#e8ebfc, #272c52);
  --d-on-work: light-dark(#ffffff, #14162b);
  --d-ask: light-dark(#8a5a00, #e9b949);
  --d-ask-soft: light-dark(#fff3d1, #3a300f);
  --d-ok: light-dark(#17794c, #48d597);
  --d-ok-soft: light-dark(#def5e8, #12301f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-line); }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
</style>
<rect x="8" y="8" width="188" height="480" rx="14" class="zone"/>
<text x="22" y="31" class="label" text-anchor="start"><tspan x="22" dy="0">You</tspan></text>
<rect x="232" y="8" width="340" height="480" rx="14" class="zone"/>
<text x="246" y="31" class="label" text-anchor="start"><tspan x="246" dy="0">The machine that plans</tspan></text>
<rect x="608" y="8" width="344" height="318" rx="14" class="zone"/>
<text x="622" y="31" class="label" text-anchor="start"><tspan x="622" dy="0">A machine that works</tspan></text>
<rect x="608" y="340" width="344" height="148" rx="14" class="zone"/>
<text x="622" y="363" class="label" text-anchor="start"><tspan x="622" dy="0">GitHub</tspan></text>
<rect x="20" y="46" width="164" height="96" rx="10" class="card"/>
<text x="32" y="71" class="title" text-anchor="start"><tspan x="32" dy="0">The chat</tspan></text>
<text x="32" y="93" class="" text-anchor="start"><tspan x="32" dy="0">Say the work.</tspan><tspan x="32" dy="17">Answer questions.</tspan></text>
<rect x="20" y="200" width="164" height="96" rx="10" class="card"/>
<text x="32" y="225" class="title" text-anchor="start"><tspan x="32" dy="0">The app and</tspan><tspan x="32" dy="18">the dashboard</tspan></text>
<text x="32" y="266" class="" text-anchor="start"><tspan x="32" dy="0">Watch. They only read.</tspan></text>
<rect x="20" y="378" width="164" height="96" rx="10" class="card"/>
<text x="32" y="403" class="title" text-anchor="start"><tspan x="32" dy="0"><tspan class="code">orc merge</tspan></tspan></text>
<text x="32" y="425" class="" text-anchor="start"><tspan x="32" dy="0">Land a pull request</tspan><tspan x="32" dy="17">once CI is green.</tspan></text>
<rect x="246" y="46" width="312" height="96" rx="10" class="card"/>
<text x="258" y="71" class="title" text-anchor="start"><tspan x="258" dy="0">The backlog</tspan></text>
<text x="258" y="91" class="" text-anchor="start"><tspan x="258" dy="0">One file per task. The folder is its state.</tspan></text>
<rect x="258" y="104" width="72" height="26" rx="6" class="card-work"/>
<text x="294" y="121.5" class="code" text-anchor="middle"><tspan x="294" dy="0">new</tspan></text>
<path d="M333,117 L351,117" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(351,117) rotate(0)"/>
<rect x="354" y="104" width="72" height="26" rx="6" class="card"/>
<text x="390" y="121.5" class="code" text-anchor="middle"><tspan x="390" dy="0">taken</tspan></text>
<path d="M429,117 L447,117" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(447,117) rotate(0)"/>
<rect x="450" y="104" width="72" height="26" rx="6" class="card"/>
<text x="486" y="121.5" class="code" text-anchor="middle"><tspan x="486" dy="0">closed</tspan></text>
<rect x="246" y="190" width="140" height="112" rx="10" class="card-work"/>
<path d="M330,210 h44" class="faint"/>
<path d="M330,210 h34" class="line-work"/>
<path d="M330,220 h44" class="faint"/>
<path d="M330,220 h12" class="line-work"/>
<text x="258" y="215" class="title" text-anchor="start"><tspan x="258" dy="0">Quota</tspan></text>
<text x="258" y="240" class="" text-anchor="start"><tspan x="258" dy="0">Room left on</tspan><tspan x="258" dy="17">each account.</tspan></text>
<rect x="418" y="190" width="140" height="112" rx="10" class="card"/>
<circle cx="534" cy="212" r="12" class="card"/>
<path d="M534,212 V204.8 M534,212 H539.4" class="line"/>
<text x="430" y="215" class="title" text-anchor="start"><tspan x="430" dy="0">The beat</tspan></text>
<text x="430" y="240" class="" text-anchor="start"><tspan x="430" dy="0">Every few minutes,</tspan><tspan x="430" dy="17">starts what can</tspan><tspan x="430" dy="17">start.</tspan></text>
<rect x="246" y="350" width="312" height="112" rx="10" class="card-ask"/>
<text x="258" y="375" class="title" text-anchor="start"><tspan x="258" dy="0">The attention queue</tspan></text>
<text x="258" y="397" class="" text-anchor="start"><tspan x="258" dy="0">Every open question waits here. A small model</tspan><tspan x="258" dy="17">answers the routine ones from your rules.</tspan><tspan x="258" dy="17">The rest wait for you.</tspan></text>
<rect x="622" y="46" width="316" height="74" rx="10" class="card"/>
<rect x="868" y="60" width="16" height="16" rx="4" class="card-work"/>
<rect x="889" y="60" width="16" height="16" rx="4" class="card-work"/>
<rect x="910" y="60" width="16" height="16" rx="4" class="card"/>
<text x="634" y="71" class="title" text-anchor="start"><tspan x="634" dy="0">The runner</tspan></text>
<text x="634" y="93" class="" text-anchor="start"><tspan x="634" dy="0">A queue on the machine, a few tasks at a time.</tspan></text>
<rect x="622" y="150" width="316" height="162" rx="10" class="card"/>
<text x="634" y="175" class="title" text-anchor="start"><tspan x="634" dy="0">A run</tspan></text>
<text x="634" y="195" class="" text-anchor="start"><tspan x="634" dy="0">Its own copy of the project, on a new branch.</tspan></text>
<rect x="634" y="214" width="88" height="40" rx="8" class="card-work"/>
<text x="678" y="239" class="" text-anchor="middle"><tspan x="678" dy="0">Agent writes</tspan></text>
<path d="M724,234 L740,234" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(740,234) rotate(0)"/>
<rect x="742" y="214" width="78" height="40" rx="8" class="card-work"/>
<text x="781" y="239" class="" text-anchor="middle"><tspan x="781" dy="0">Checks</tspan></text>
<path d="M822,234 L838,234" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(838,234) rotate(0)"/>
<rect x="840" y="214" width="86" height="40" rx="8" class="card-work"/>
<text x="883" y="239" class="" text-anchor="middle"><tspan x="883" dy="0">Review</tspan></text>
<path d="M781,256 L781,276 L678,276 L678,258" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(678,258) rotate(-90)"/>
<text x="730" y="296" class="ask-text" text-anchor="middle"><tspan x="730" dy="0">refused: the agent fixes it</tspan></text>
<rect x="622" y="378" width="316" height="96" rx="10" class="card-ok"/>
<circle cx="916" cy="400" r="9" class="dot-ok"/><path d="M912,400 l3,3.2 l5.2,-6" fill="none" stroke="var(--d-card)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="634" y="403" class="title" text-anchor="start"><tspan x="634" dy="0">The pull request</tspan></text>
<text x="634" y="425" class="" text-anchor="start"><tspan x="634" dy="0">Opened after the review.</tspan><tspan x="634" dy="17">Merged once CI is green.</tspan></text>
<path d="M184,76 L244,76" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(244,76) rotate(0)"/>
<circle cx="214" cy="76" r="12" class="dot-work"/><text x="214" y="80.5" class="num" text-anchor="middle"><tspan x="214" dy="0">1</tspan></text>
<path d="M488,142 L488,188" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(488,188) rotate(90)"/>
<circle cx="488" cy="164" r="12" class="dot-work"/><text x="488" y="168.5" class="num" text-anchor="middle"><tspan x="488" dy="0">2</tspan></text>
<path d="M386,246 L416,246" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(416,246) rotate(0)"/>
<path d="M558,226 L590,226 L590,83 L620,83" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(620,83) rotate(0)"/>
<circle cx="590" cy="150" r="12" class="dot-work"/><text x="590" y="154.5" class="num" text-anchor="middle"><tspan x="590" dy="0">3</tspan></text>
<path d="M780,120 L780,148" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(780,148) rotate(90)"/>
<circle cx="780" cy="134" r="12" class="dot-work"/><text x="780" y="138.5" class="num" text-anchor="middle"><tspan x="780" dy="0">4</tspan></text>
<path d="M883,256 L883,376" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(883,376) rotate(90)"/>
<circle cx="883" cy="326" r="12" class="dot-work"/><text x="883" y="330.5" class="num" text-anchor="middle"><tspan x="883" dy="0">5</tspan></text>
<path d="M184,440 L214,440 L214,475 L590,475 L590,440 L620,440" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(620,440) rotate(0)"/>
<circle cx="400" cy="475" r="12" class="dot-work"/><text x="400" y="479.5" class="num" text-anchor="middle"><tspan x="400" dy="0">6</tspan></text>
<path d="M622,290 L590,290 L590,400 L560,400" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(560,400) rotate(180)"/>
<circle cx="590" cy="345" r="12" class="dot-ask"/><text x="590" y="349.5" class="num-ask" text-anchor="middle"><tspan x="590" dy="0">?</tspan></text>
<path d="M246,400 L214,400 L214,120 L186,120" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(186,120) rotate(180)"/>
<circle cx="214" cy="300" r="12" class="dot-ask"/><text x="214" y="304.5" class="num-ask" text-anchor="middle"><tspan x="214" dy="0">?</tspan></text>
</svg>
