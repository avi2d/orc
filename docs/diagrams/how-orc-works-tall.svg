<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1776" class="orc-d" role="img" aria-labelledby="d-how-orc-works-tall-title d-how-orc-works-tall-desc">
<title id="d-how-orc-works-tall-title">How orc works: every part, and every way a task ends</title>
<desc id="d-how-orc-works-tall-desc">You say the work in the chat. The backlog keeps one file per task. The beat reads the quota and starts a task on a machine with a free slot. The runner queues it, an agent writes the change, and the checks and a review judge it. A question waits in the attention queue, where the decider answers the routine ones and you answer the rest. A task ends dropped, answered, stopped, failed, with a report, or with a pull request that you merge.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-work-soft: light-dark(#f7e6de, #342019);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#ede4d3, #3b2d1a);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .mark-running, .orc-d .mark-failed { color: var(--d-work); }
.orc-d .mark-waiting { color: var(--d-mute); }
.orc-d .mark-done { color: var(--d-ok); }
.orc-d .mark-attention { color: var(--d-ask); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="246" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">You</tspan></text>
<g data-part="chat"><rect x="16" y="36" width="328" height="62" rx="10" class="card"/><circle cx="36" cy="58" r="8" class="dot-work"/><text x="36" y="61.5" class="num" text-anchor="middle"><tspan x="36" dy="0">1</tspan></text><text x="50" y="64" class="title" text-anchor="start"><tspan x="50" dy="0">The chat</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">Say the work. Answer questions.</tspan></text><path d="M325,54 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="app"><rect x="16" y="106" width="328" height="62" rx="10" class="card"/><text x="28" y="134" class="title" text-anchor="start"><tspan x="28" dy="0">The app and the dashboard</tspan></text><text x="28" y="152" class="" text-anchor="start"><tspan x="28" dy="0">Show it all. Hold no state.</tspan></text><path d="M325,124 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="merge"><rect x="16" y="176" width="328" height="62" rx="10" class="card"/><text x="28" y="204" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc merge</tspan></tspan></text><text x="28" y="222" class="" text-anchor="start"><tspan x="28" dy="0">Land a pull request once CI is green.</tspan></text><path d="M325,194 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,253 L180,271" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,271) rotate(90)"/>
<rect x="4" y="274" width="352" height="522" rx="14" class="zone"/><text x="16" y="295" class="label" text-anchor="start"><tspan x="16" dy="0">The machine that plans</tspan></text>
<g data-part="backlog"><rect x="16" y="306" width="328" height="96" rx="10" class="card"/><circle cx="36" cy="328" r="8" class="dot-work"/><text x="36" y="331.5" class="num" text-anchor="middle"><tspan x="36" dy="0">2</tspan></text><text x="50" y="334" class="title" text-anchor="start"><tspan x="50" dy="0">The backlog</tspan></text><text x="28" y="352" class="" text-anchor="start"><tspan x="28" dy="0">One file per task, in priority order.</tspan></text><rect x="28" y="364" width="68" height="26" rx="6" class="card-work"/><text x="62" y="381.5" class="" text-anchor="middle"><tspan x="62" dy="0"><tspan class="code">new</tspan></tspan></text><path d="M99,377 L123,377" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(123,377) rotate(0)"/><rect x="126" y="364" width="68" height="26" rx="6" class="card"/><text x="160" y="381.5" class="" text-anchor="middle"><tspan x="160" dy="0"><tspan class="code">taken</tspan></tspan></text><path d="M197,377 L221,377" class="line"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-mute" transform="translate(221,377) rotate(0)"/><rect x="224" y="364" width="68" height="26" rx="6" class="card"/><text x="258" y="381.5" class="" text-anchor="middle"><tspan x="258" dy="0"><tspan class="code">closed</tspan></tspan></text><path d="M325,324 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,404 L180,424" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,424) rotate(90)"/>
<g data-part="beat"><rect x="16" y="426" width="328" height="62" rx="10" class="card"/><circle cx="36" cy="448" r="8" class="dot-work"/><text x="36" y="451.5" class="num" text-anchor="middle"><tspan x="36" dy="0">3</tspan></text><text x="50" y="454" class="title" text-anchor="start"><tspan x="50" dy="0">The beat</tspan></text><text x="28" y="472" class="" text-anchor="start"><tspan x="28" dy="0">Every few minutes, starts what can start.</tspan></text><path d="M325,444 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="quota"><rect x="16" y="496" width="328" height="92" rx="10" class="card-work"/><text x="28" y="524" class="title" text-anchor="start"><tspan x="28" dy="0">Quota</tspan></text><text x="28" y="542" class="" text-anchor="start"><tspan x="28" dy="0">Room left on each account.</tspan></text><path d="M28,562 h110" class="faint"/><path d="M28,562 h82" class="line-work"/><path d="M28,574 h110" class="faint"/><path d="M28,574 h30" class="line-work"/><path d="M325,514 l5,5.5 l-5,5.5" class="line-work"/></g>
<g data-part="attention"><rect x="16" y="596" width="328" height="62" rx="10" class="card-ask"/><text x="28" y="624" class="title" text-anchor="start"><tspan x="28" dy="0">The attention queue</tspan></text><text x="28" y="642" class="" text-anchor="start"><tspan x="28" dy="0">Every open question waits here.</tspan></text><svg x="180.3" y="611" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-attention" aria-hidden="true"><path fill-rule="evenodd" d="M12 1C5.5 1 1 5.5 1 11.5C1 14.3 2 16 3.2 17.6L1.7 21.2Q1 23 3.1 22.2L7.2 20.5C8.5 21.2 10.3 22 12 22C18.5 22 23 17.5 23 11.5S18.5 1 12 1ZM10.3 5.3A1.7 1.7 0 0 1 13.7 5.3V12A1.7 1.7 0 0 1 10.3 12ZM12 15.5A1.7 1.7 0 1 0 12 18.9A1.7 1.7 0 1 0 12 15.5Z"/></svg><path d="M325,614 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,660 L180,680" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,680) rotate(90)"/>
<text x="192" y="674" class="ask-text" text-anchor="start"><tspan x="192" dy="0">routine questions</tspan></text>
<g data-part="attention"><rect x="16" y="682" width="328" height="78" rx="10" class="card-ask"/><text x="28" y="710" class="title" text-anchor="start"><tspan x="28" dy="0">The decider</tspan></text><text x="28" y="728" class="" text-anchor="start"><tspan x="28" dy="0">A small model. It answers a routine question by</tspan><tspan x="28" dy="16">quoting a rule you wrote.</tspan></text><path d="M325,700 l5,5.5 l-5,5.5" class="line-work"/></g>
<text x="20" y="778" class="ask-text" text-anchor="start"><tspan x="20" dy="0">The rest wait for you.</tspan></text>
<path d="M180,799 L180,817" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,817) rotate(90)"/>
<rect x="4" y="820" width="352" height="456" rx="14" class="zone"/><text x="16" y="841" class="label" text-anchor="start"><tspan x="16" dy="0">A machine that works</tspan></text>
<g data-part="runner"><rect x="16" y="852" width="328" height="62" rx="10" class="card"/><circle cx="36" cy="874" r="8" class="dot-work"/><text x="36" y="877.5" class="num" text-anchor="middle"><tspan x="36" dy="0">4</tspan></text><text x="50" y="880" class="title" text-anchor="start"><tspan x="50" dy="0">The runner</tspan></text><text x="28" y="898" class="" text-anchor="start"><tspan x="28" dy="0">A queue on the machine, a few tasks at a time.</tspan></text><path d="M325,870 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,916 L180,936" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,936) rotate(90)"/>
<g data-part="run"><rect x="16" y="938" width="328" height="78" rx="10" class="card"/><circle cx="36" cy="960" r="8" class="dot-work"/><text x="36" y="963.5" class="num" text-anchor="middle"><tspan x="36" dy="0">5</tspan></text><text x="50" y="966" class="title" text-anchor="start"><tspan x="50" dy="0">A run</tspan></text><text x="28" y="984" class="" text-anchor="start"><tspan x="28" dy="0">An agent writes the change in its own copy of</tspan><tspan x="28" dy="16">the project, on a new branch.</tspan></text><svg x="94.5" y="953" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-running" aria-hidden="true"><path d="M10 4.5Q10 2.7 11.7 3.7L22 10.3Q24 11.7 22 13.1L11.7 20Q10 21 10 19.2Z"/></svg><path d="M325,956 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,1018 L180,1038" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,1038) rotate(90)"/>
<g data-part="checks"><rect x="16" y="1040" width="328" height="184" rx="10" class="card"/><circle cx="36" cy="1062" r="8" class="dot-work"/><text x="36" y="1065.5" class="num" text-anchor="middle"><tspan x="36" dy="0">6</tspan></text><text x="50" y="1068" class="title" text-anchor="start"><tspan x="50" dy="0">Checks and review</tspan></text><text x="28" y="1086" class="" text-anchor="start"><tspan x="28" dy="0">The agent fixes what the checks refuse. Then a</tspan><tspan x="28" dy="16">review reads the branch.</tspan></text><rect x="28" y="1120" width="82" height="32" rx="6" class="card-work"/><text x="69" y="1140.5" class="" text-anchor="middle"><tspan x="69" dy="0">Checks</tspan></text><path d="M113,1136 L123,1136" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(123,1136) rotate(0)"/><rect x="126" y="1120" width="82" height="32" rx="6" class="card-work"/><text x="167" y="1140.5" class="" text-anchor="middle"><tspan x="167" dy="0">Review</tspan></text><circle cx="31" cy="1170" r="2" class="dot-mute-strong"/><text x="40" y="1174" class="" text-anchor="start"><tspan x="40" dy="0">Still red after three fixes: the run fails.</tspan></text><circle cx="31" cy="1188" r="2" class="dot-mute-strong"/><text x="40" y="1192" class="" text-anchor="start"><tspan x="40" dy="0">A question waits here 30 minutes. Then the</tspan><tspan x="40" dy="16">task parks on its branch.</tspan></text><path d="M325,1058 l5,5.5 l-5,5.5" class="line-work"/></g>
<text x="20" y="1242" class="ask-text" text-anchor="start"><tspan x="20" dy="0">A question the run cannot settle goes to the</tspan><tspan x="20" dy="16">attention queue.</tspan></text>
<path d="M180,1279 L180,1297" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,1297) rotate(90)"/>
<rect x="4" y="1300" width="352" height="472" rx="14" class="zone"/><text x="16" y="1321" class="label" text-anchor="start"><tspan x="16" dy="0">How a task ends</tspan></text>
<rect x="16" y="1332" width="328" height="62" rx="10" class="card"/><text x="28" y="1360" class="title" text-anchor="start"><tspan x="28" dy="0">Dropped</tspan></text><text x="28" y="1378" class="" text-anchor="start"><tspan x="28" dy="0">Before it started.</tspan></text>
<rect x="16" y="1402" width="328" height="62" rx="10" class="card"/><text x="28" y="1430" class="title" text-anchor="start"><tspan x="28" dy="0">Answered</tspan></text><text x="28" y="1448" class="" text-anchor="start"><tspan x="28" dy="0">A decision never runs. Your answer closes it.</tspan></text>
<rect x="16" y="1472" width="328" height="62" rx="10" class="card"/><text x="28" y="1500" class="title" text-anchor="start"><tspan x="28" dy="0">Stopped</tspan></text><text x="28" y="1518" class="" text-anchor="start"><tspan x="28" dy="0">You stopped the run.</tspan></text>
<rect x="16" y="1542" width="328" height="78" rx="10" class="card"/><text x="28" y="1570" class="title" text-anchor="start"><tspan x="28" dy="0">Failed</tspan></text><text x="28" y="1588" class="" text-anchor="start"><tspan x="28" dy="0">It could not start, it died, or its checks</tspan><tspan x="28" dy="16">stayed red.</tspan></text><svg x="80.2" y="1557" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-failed" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
<rect x="16" y="1628" width="328" height="62" rx="10" class="card-ok"/><text x="28" y="1656" class="title" text-anchor="start"><tspan x="28" dy="0">A report</tspan></text><text x="28" y="1674" class="" text-anchor="start"><tspan x="28" dy="0">A task that changes no code. No pull request.</tspan></text><svg x="95.6" y="1643" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-done" aria-hidden="true"><path d="M4 12L9 17L20 5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<g data-part="merge"><rect x="16" y="1698" width="328" height="62" rx="10" class="card-ok"/><text x="28" y="1726" class="title" text-anchor="start"><tspan x="28" dy="0">A pull request</tspan></text><text x="28" y="1744" class="" text-anchor="start"><tspan x="28" dy="0">A code change. You merge it once CI is green.</tspan></text><svg x="141.8" y="1713" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-done" aria-hidden="true"><path d="M4 12L9 17L20 5" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><path d="M325,1716 l5,5.5 l-5,5.5" class="line-work"/></g>
</svg>
