<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1112" class="orc-d" role="img" aria-labelledby="d-attention-tall-title d-attention-tall-desc">
<title id="d-attention-tall-title">The attention queue and the decider: who answers what</title>
<desc id="d-attention-tall-desc">A question from a run and news for you both open an item in the attention queue. A question on a guarded topic goes straight to you. Any other question goes to the decider, a small model that may answer only by quoting a rule you wrote. When no rule settles it, the question goes to you. Your answer replaces the decider's, and the run carries on.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-work-soft: light-dark(#f7e6de, #342019);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#ede4d3, #3b2d1a);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-work { fill: var(--d-work-soft); stroke: var(--d-work); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .mark-running, .orc-d .mark-failed { color: var(--d-work); }
.orc-d .mark-waiting { color: var(--d-mute); }
.orc-d .mark-done { color: var(--d-ok); }
.orc-d .mark-attention { color: var(--d-ask); }
.orc-d .line { fill: none; stroke: var(--d-mute); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-mute { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 13px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 13px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="310" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">What opens an item</tspan></text>
<g data-part="checks"><rect x="16" y="36" width="328" height="78" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">A question from a run</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">The review raised it, or the agent asked it</tspan><tspan x="28" dy="16">instead of guessing.</tspan></text><path d="M325,54 l5,5.5 l-5,5.5" class="line-work"/></g>
<rect x="16" y="122" width="328" height="140" rx="10" class="card"/><text x="28" y="150" class="title" text-anchor="start"><tspan x="28" dy="0">News for you</tspan></text><circle cx="31" cy="168" r="2" class="dot-mute-strong"/><text x="40" y="172" class="" text-anchor="start"><tspan x="40" dy="0">a run died</tspan></text><circle cx="31" cy="186" r="2" class="dot-mute-strong"/><text x="40" y="190" class="" text-anchor="start"><tspan x="40" dy="0">a check went red</tspan></text><circle cx="31" cy="204" r="2" class="dot-mute-strong"/><text x="40" y="208" class="" text-anchor="start"><tspan x="40" dy="0">a pull request is ready</tspan></text><circle cx="31" cy="222" r="2" class="dot-mute-strong"/><text x="40" y="226" class="" text-anchor="start"><tspan x="40" dy="0">a hold is overdue</tspan></text><circle cx="31" cy="240" r="2" class="dot-mute-strong"/><text x="40" y="244" class="" text-anchor="start"><tspan x="40" dy="0">a command keeps failing</tspan></text>
<text x="20" y="280" class="ask-text" text-anchor="start"><tspan x="20" dy="0">News waits for you. A question takes the path</tspan><tspan x="20" dy="16">below.</tspan></text>
<path d="M180,317 L180,335" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,335) rotate(90)"/>
<rect x="4" y="338" width="352" height="538" rx="14" class="zone"/><text x="16" y="359" class="label" text-anchor="start"><tspan x="16" dy="0">The machine that plans</tspan></text>
<rect x="16" y="370" width="328" height="78" rx="10" class="card-ask"/><text x="28" y="398" class="title" text-anchor="start"><tspan x="28" dy="0">The attention queue</tspan></text><text x="28" y="416" class="" text-anchor="start"><tspan x="28" dy="0">Everything that waits on someone, oldest first.</tspan><tspan x="28" dy="16"><tspan class="code">orc attention</tspan> lists it.</tspan></text><svg x="316" y="385" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="mark mark-attention" aria-hidden="true"><path fill-rule="evenodd" d="M12 1C5.5 1 1 5.5 1 11.5C1 14.3 2 16 3.2 17.6L1.7 21.2Q1 23 3.1 22.2L7.2 20.5C8.5 21.2 10.3 22 12 22C18.5 22 23 17.5 23 11.5S18.5 1 12 1ZM10.3 5.3A1.7 1.7 0 0 1 13.7 5.3V12A1.7 1.7 0 0 1 10.3 12ZM12 15.5A1.7 1.7 0 1 0 12 18.9A1.7 1.7 0 1 0 12 15.5Z"/></svg>
<path d="M180,450 L180,470" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,470) rotate(90)"/>
<rect x="16" y="472" width="328" height="140" rx="10" class="card-ask"/><text x="28" y="500" class="title" text-anchor="start"><tspan x="28" dy="0">Is it on a guarded topic?</tspan></text><circle cx="31" cy="518" r="2" class="dot-mute-strong"/><text x="40" y="522" class="" text-anchor="start"><tspan x="40" dy="0">deleting, or anything that cannot be undone</tspan></text><circle cx="31" cy="536" r="2" class="dot-mute-strong"/><text x="40" y="540" class="" text-anchor="start"><tspan x="40" dy="0">security, keys and logins</tspan></text><circle cx="31" cy="554" r="2" class="dot-mute-strong"/><text x="40" y="558" class="" text-anchor="start"><tspan x="40" dy="0">merging, pushing, releasing</tspan></text><circle cx="31" cy="572" r="2" class="dot-mute-strong"/><text x="40" y="576" class="" text-anchor="start"><tspan x="40" dy="0">spending</tspan></text><circle cx="31" cy="590" r="2" class="dot-mute-strong"/><text x="40" y="594" class="" text-anchor="start"><tspan x="40" dy="0">a site's look, and legal text</tspan></text>
<text x="20" y="630" class="ask-text" text-anchor="start"><tspan x="20" dy="0">Yes: it goes straight to you.</tspan></text>
<path d="M180,638 L180,658" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,658) rotate(90)"/>
<text x="192" y="652" class="ask-text" text-anchor="start"><tspan x="192" dy="0">no</tspan></text>
<rect x="16" y="660" width="328" height="78" rx="10" class="card-ask"/><text x="28" y="688" class="title" text-anchor="start"><tspan x="28" dy="0">The decider</tspan></text><text x="28" y="706" class="" text-anchor="start"><tspan x="28" dy="0">A small model with no tools. It reads your</tspan><tspan x="28" dy="16">rules, the project's instructions and the task.</tspan></text>
<path d="M180,740 L180,760" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,760) rotate(90)"/>
<rect x="16" y="762" width="328" height="78" rx="10" class="card-ask"/><text x="28" y="790" class="title" text-anchor="start"><tspan x="28" dy="0">Can it quote a rule that settles it?</tspan></text><text x="28" y="808" class="" text-anchor="start"><tspan x="28" dy="0">It may answer only by quoting your rule, word</tspan><tspan x="28" dy="16">for word.</tspan></text>
<text x="20" y="858" class="ask-text" text-anchor="start"><tspan x="20" dy="0">Yes: answered. No: it goes to you.</tspan></text>
<path d="M180,879 L180,897" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,897) rotate(90)"/>
<rect x="4" y="900" width="352" height="208" rx="14" class="zone"/><text x="16" y="921" class="label" text-anchor="start"><tspan x="16" dy="0">You</tspan></text>
<g data-part="chat"><rect x="16" y="932" width="328" height="78" rx="10" class="card"/><text x="28" y="960" class="title" text-anchor="start"><tspan x="28" dy="0">You answer</tspan></text><text x="28" y="978" class="" text-anchor="start"><tspan x="28" dy="0">In the chat, in the app, or with <tspan class="code">orc backlog</tspan></tspan><tspan x="28" dy="16"><tspan class="code">answer</tspan>. Your answer replaces the decider's.</tspan></text><path d="M325,950 l5,5.5 l-5,5.5" class="line-work"/></g>
<path d="M180,1012 L180,1032" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,1032) rotate(90)"/>
<rect x="16" y="1034" width="328" height="62" rx="10" class="card-ok"/><text x="28" y="1062" class="title" text-anchor="start"><tspan x="28" dy="0">Answered</tspan></text><text x="28" y="1080" class="" text-anchor="start"><tspan x="28" dy="0">The run carries on where it waited.</tspan></text>
</svg>
