<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1382" class="orc-d" role="img" aria-labelledby="d-checks-tall-title d-checks-tall-desc">
<title id="d-checks-tall-title">Checks and review: the two gates a code change passes</title>
<desc id="d-checks-tall-desc">After Pi commits, orc runs the project's checks. When one fails, a fixer repairs it and the checks run again, and after three fixes with a check still red the run fails and no pull request opens. Once the checks are green, no-mistakes reviews the branch. Orc has it fix a finding marked auto-fix, ignores no-op, and treats a finding marked ask-user or with any other action as a question that waits at the gate for 30 minutes before the task parks on its branch. After orc answers 20 gates without an outcome it asks gate-cap before it answers more. Then no-mistakes pushes the branch, opens the pull request and waits for green CI. The project's mode decides which of these a ship task goes through.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#fbe7ae, #4d3b12);
  --d-end-soft: light-dark(#d9d5cf, #45403b);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .card-end { fill: var(--d-end-soft); stroke: var(--d-mute); stroke-width: 1.5; }
.orc-d .line-aside { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .chevron { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .bar { fill: none; stroke: var(--d-mute); stroke-width: 3; stroke-linecap: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-aside { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="412" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">Gate 1: the project's checks</tspan></text>
<g data-part="run"><rect x="16" y="36" width="328" height="62" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">The branch</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0">Pi's commits, in the run's copy of the project.</tspan></text><path d="M325,54 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M180,100 L180,120" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,120) rotate(90)"/>
<rect x="16" y="122" width="328" height="78" rx="10" class="card"/><text x="28" y="150" class="title" text-anchor="start"><tspan x="28" dy="0">The checks</tspan></text><text x="28" y="168" class="" text-anchor="start"><tspan x="28" dy="0">The commands the project names in</tspan><tspan x="28" dy="16"><tspan class="code">.no-mistakes.yaml</tspan>.</tspan></text>
<path d="M180,202 L180,222" class="line-aside"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-aside" transform="translate(180,222) rotate(90)"/>
<text x="192" y="216" class="" text-anchor="start"><tspan x="192" dy="0">red</tspan></text>
<rect x="16" y="224" width="328" height="78" rx="10" class="card"/><text x="28" y="252" class="title" text-anchor="start"><tspan x="28" dy="0">A fixer</tspan></text><text x="28" y="270" class="" text-anchor="start"><tspan x="28" dy="0">A second Pi gets the failing output and repairs</tspan><tspan x="28" dy="16">it. Then the checks run again.</tspan></text>
<path d="M180,304 L180,324" class="line-aside"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-aside" transform="translate(180,324) rotate(90)"/>
<text x="192" y="318" class="" text-anchor="start"><tspan x="192" dy="0">red after 3 fixes</tspan></text>
<rect x="16" y="326" width="328" height="78" rx="10" class="card-end"/><text x="28" y="354" class="title" text-anchor="start"><tspan x="28" dy="0">The run fails</tspan></text><text x="28" y="372" class="" text-anchor="start"><tspan x="28" dy="0">A check is still red after 3 fixes. No pull</tspan><tspan x="28" dy="16">request opens.</tspan></text>
<path d="M180,419 L180,437" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,437) rotate(90)"/>
<rect x="4" y="440" width="352" height="620" rx="14" class="zone"/><text x="16" y="461" class="label" text-anchor="start"><tspan x="16" dy="0">Gate 2: the review</tspan></text>
<rect x="16" y="472" width="328" height="78" rx="10" class="card"/><text x="28" y="500" class="title" text-anchor="start"><tspan x="28" dy="0">no-mistakes reviews the branch</tspan></text><text x="28" y="518" class="" text-anchor="start"><tspan x="28" dy="0">It gets the task as its intent, and marks each</tspan><tspan x="28" dy="16">finding.</tspan></text>
<path d="M180,552 L180,572" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,572) rotate(90)"/>
<rect x="16" y="574" width="328" height="120" rx="10" class="card"/><text x="28" y="602" class="title" text-anchor="start"><tspan x="28" dy="0">What orc does with a finding</tspan></text><circle cx="31" cy="620" r="2" class="dot-mute-strong"/><text x="40" y="624" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">auto-fix</tspan>: asks no-mistakes to fix it</tspan></text><circle cx="31" cy="638" r="2" class="dot-mute-strong"/><text x="40" y="642" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">no-op</tspan>: ignores it</tspan></text><circle cx="31" cy="656" r="2" class="dot-mute-strong"/><text x="40" y="660" class="" text-anchor="start"><tspan x="40" dy="0"><tspan class="code">ask-user</tspan> or any other action: a question that</tspan><tspan x="40" dy="16">waits for an answer</tspan></text>
<path d="M180,696 L180,716" class="line-ask"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-ask" transform="translate(180,716) rotate(90)"/>
<text x="192" y="710" class="ask-text" text-anchor="start"><tspan x="192" dy="0">a question</tspan></text>
<g data-part="attention"><rect x="16" y="718" width="328" height="126" rx="10" class="card-ask"/><text x="28" y="746" class="title" text-anchor="start"><tspan x="28" dy="0">A question waits at the gate</tspan></text><text x="28" y="764" class="" text-anchor="start"><tspan x="28" dy="0">For 30 minutes. An answer in that time carries</tspan><tspan x="28" dy="16">the run on. With none, the task parks on its</tspan><tspan x="28" dy="16">branch, and resumes once every question has an</tspan><tspan x="28" dy="16">answer. After 20 gates without an outcome orc</tspan><tspan x="28" dy="16">asks gate-cap and waits the same way.</tspan></text><path d="M325,736 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M180,846 L180,866" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,866) rotate(90)"/>
<rect x="16" y="868" width="328" height="78" rx="10" class="card"/><text x="28" y="896" class="title" text-anchor="start"><tspan x="28" dy="0">no-mistakes delivers</tspan></text><text x="28" y="914" class="" text-anchor="start"><tspan x="28" dy="0">It pushes the branch, opens the pull request and</tspan><tspan x="28" dy="16">waits for green CI.</tspan></text>
<path d="M180,948 L180,968" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,968) rotate(90)"/>
<g data-part="merge"><rect x="16" y="970" width="328" height="78" rx="10" class="card-ok"/><text x="28" y="998" class="title" text-anchor="start"><tspan x="28" dy="0">A pull request</tspan></text><text x="28" y="1016" class="" text-anchor="start"><tspan x="28" dy="0">A code change, checked before it reaches you.</tspan><tspan x="28" dy="16">Delivery may include review.</tspan></text><path d="M325,988 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M180,1063 L180,1081" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,1081) rotate(90)"/>
<rect x="4" y="1084" width="352" height="294" rx="14" class="zone"/><text x="16" y="1105" class="label" text-anchor="start"><tspan x="16" dy="0">A ship task, by the project's mode</tspan></text>
<rect x="16" y="1116" width="328" height="78" rx="10" class="card"/><text x="28" y="1144" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">no-mistakes</tspan></tspan></text><text x="28" y="1162" class="" text-anchor="start"><tspan x="28" dy="0">The default. Checks, then the review, then a</tspan><tspan x="28" dy="16">pull request with green CI.</tspan></text>
<rect x="16" y="1202" width="328" height="78" rx="10" class="card"/><text x="28" y="1230" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">direct-PR</tspan></tspan></text><text x="28" y="1248" class="" text-anchor="start"><tspan x="28" dy="0">Checks, then a review turn that only records</tspan><tspan x="28" dy="16">findings, then orc opens the pull request.</tspan></text>
<rect x="16" y="1288" width="328" height="78" rx="10" class="card"/><text x="28" y="1316" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">no-mistakes-prod-only</tspan></tspan></text><text x="28" y="1334" class="" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">direct-PR</tspan> for a task marked internal,</tspan><tspan x="28" dy="16"><tspan class="code">no-mistakes</tspan> for the rest.</tspan></text>
</svg>
