<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1194" class="orc-d" role="img" aria-labelledby="d-merge-tall-title d-merge-tall-desc">
<title id="d-merge-tall-title">The merge: what orc merge checks before it lands a pull request</title>
<desc id="d-merge-tall-desc">You, the chat, the app and the beat all merge through orc merge. It merges only when the task names a pull request, the pull request is open, every check has reported green, and the branch is not behind its base. Otherwise it refuses, names every reason, and merges nothing. It squash merges at the exact commit it checked. A merge traces back to your word or to the yolo you set, and the decider never answers a question about merging.</desc>
<style>.orc-d {
  color-scheme: light dark;
  --d-ink: light-dark(#221812, #f3e8d6);
  --d-mute: light-dark(#5b4a3c, #bca995);
  --d-line: light-dark(#d6c8b1, #43352a);
  --d-edge: light-dark(#3a2a1f, #7a6655);
  --d-card: light-dark(#fffbf2, #211a14);
  --d-zone: light-dark(#eee5d4, #2c231b);
  --d-work: light-dark(#a3160f, #f0624a);
  --d-on-work: light-dark(#fff8ec, #1a0b07);
  --d-ask: light-dark(#774d00, #e6ac3f);
  --d-ask-soft: light-dark(#fbe7ae, #4d3b12);
  --d-end-soft: light-dark(#d9d5cf, #45403b);
  --d-ok: light-dark(#2d6220, #9dc56e);
  --d-ok-soft: light-dark(#e6e9d9, #302f1f);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.orc-d text { fill: var(--d-mute); font-size: 12.5px; }
.orc-d .title { fill: var(--d-ink); font-size: 14px; font-weight: 650; }
.orc-d .big { fill: var(--d-ink); font-size: 15.5px; font-weight: 650; }
.orc-d .label { fill: var(--d-mute); font-size: 12px; font-weight: 600; }
.orc-d .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; fill: var(--d-ink); }
.orc-d .ask-text { fill: var(--d-ask); font-weight: 600; }
.orc-d .work-text { fill: var(--d-work); font-weight: 600; }
.orc-d .ok-text { fill: var(--d-ok); font-weight: 600; }
.orc-d .zone { fill: var(--d-zone); stroke: var(--d-line); }
.orc-d .card { fill: var(--d-card); stroke: var(--d-edge); stroke-width: 1.5; }
.orc-d .card-ask { fill: var(--d-ask-soft); stroke: var(--d-ask); stroke-width: 1.5; }
.orc-d .card-ok { fill: var(--d-ok-soft); stroke: var(--d-ok); stroke-width: 1.5; }
.orc-d .card-end { fill: var(--d-end-soft); stroke: var(--d-mute); stroke-width: 1.5; }
.orc-d .line-aside { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .chevron { fill: none; stroke: var(--d-mute); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .bar { fill: none; stroke: var(--d-mute); stroke-width: 3; stroke-linecap: round; }
.orc-d .line-work { fill: none; stroke: var(--d-work); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .line-ask { fill: none; stroke: var(--d-ask); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.orc-d .line-ok { fill: none; stroke: var(--d-ok); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .faint { fill: none; stroke: var(--d-line); stroke-width: 3; stroke-linecap: round; }
.orc-d .head-work { fill: var(--d-work); }
.orc-d .head-ask { fill: var(--d-ask); }
.orc-d .head-aside { fill: var(--d-mute); }
.orc-d .dot-work { fill: var(--d-work); }
.orc-d .dot-ask { fill: var(--d-ask); }
.orc-d .dot-ok { fill: var(--d-ok); }
.orc-d .dot-mute { fill: var(--d-line); }
.orc-d .num { fill: var(--d-on-work); font-size: 11px; font-weight: 700; }
.orc-d .num-ask { fill: var(--d-card); font-size: 11px; font-weight: 700; }
.orc-d .tick { fill: none; stroke: var(--d-card); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.orc-d .dot-mute-strong { fill: var(--d-mute); }
</style>
<rect x="4" y="4" width="352" height="246" rx="14" class="zone"/><text x="16" y="25" class="label" text-anchor="start"><tspan x="16" dy="0">Who asks</tspan></text>
<rect x="16" y="36" width="328" height="62" rx="10" class="card"/><text x="28" y="64" class="title" text-anchor="start"><tspan x="28" dy="0">You</tspan></text><text x="28" y="82" class="" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">orc merge &lt;task-id></tspan></tspan></text>
<g data-part="chat"><rect x="16" y="106" width="328" height="62" rx="10" class="card"/><text x="28" y="134" class="title" text-anchor="start"><tspan x="28" dy="0">The chat</tspan></text><text x="28" y="152" class="" text-anchor="start"><tspan x="28" dy="0">Its <tspan class="code">merge_task</tspan> tool.</tspan></text><path d="M325,124 l5,5.5 l-5,5.5" class="chevron"/></g>
<g data-part="app"><rect x="16" y="176" width="328" height="62" rx="10" class="card"/><text x="28" y="204" class="title" text-anchor="start"><tspan x="28" dy="0">The app</tspan></text><text x="28" y="222" class="" text-anchor="start"><tspan x="28" dy="0">Its Approve step.</tspan></text><path d="M325,194 l5,5.5 l-5,5.5" class="chevron"/></g>
<path d="M180,253 L180,271" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,271) rotate(90)"/>
<rect x="4" y="274" width="352" height="512" rx="14" class="zone"/><text x="16" y="295" class="label" text-anchor="start"><tspan x="16" dy="0"><tspan class="code">orc merge</tspan> lands it once all four hold</tspan></text>
<rect x="16" y="306" width="328" height="62" rx="10" class="card"/><text x="28" y="334" class="title" text-anchor="start"><tspan x="28" dy="0">A pull request</tspan></text><text x="28" y="352" class="" text-anchor="start"><tspan x="28" dy="0">The task names one.</tspan></text>
<rect x="16" y="376" width="328" height="62" rx="10" class="card"/><text x="28" y="404" class="title" text-anchor="start"><tspan x="28" dy="0">Open</tspan></text><text x="28" y="422" class="" text-anchor="start"><tspan x="28" dy="0">It is not closed, and not merged yet.</tspan></text>
<rect x="16" y="446" width="328" height="62" rx="10" class="card"/><text x="28" y="474" class="title" text-anchor="start"><tspan x="28" dy="0">Green</tspan></text><text x="28" y="492" class="" text-anchor="start"><tspan x="28" dy="0">Every check has reported, and none is red.</tspan></text>
<rect x="16" y="516" width="328" height="62" rx="10" class="card"/><text x="28" y="544" class="title" text-anchor="start"><tspan x="28" dy="0">Up to date</tspan></text><text x="28" y="562" class="" text-anchor="start"><tspan x="28" dy="0">The branch is not behind its base.</tspan></text>
<path d="M180,580 L180,600" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,600) rotate(90)"/>
<text x="192" y="594" class="" text-anchor="start"><tspan x="192" dy="0">all four hold</tspan></text>
<rect x="16" y="602" width="328" height="78" rx="10" class="card-ok"/><text x="28" y="630" class="title" text-anchor="start"><tspan x="28" dy="0">Squash merge</tspan></text><text x="28" y="648" class="" text-anchor="start"><tspan x="28" dy="0">At the exact commit it checked. A push after the</tspan><tspan x="28" dy="16">check merges nothing.</tspan></text>
<text x="20" y="698" class="label" text-anchor="start"><tspan x="20" dy="0">If one does not hold:</tspan></text>
<rect x="16" y="712" width="328" height="62" rx="10" class="card"/><text x="28" y="740" class="title" text-anchor="start"><tspan x="28" dy="0">Refused: nothing merges</tspan></text><text x="28" y="758" class="" text-anchor="start"><tspan x="28" dy="0">The refusal names every reason.</tspan></text>
<path d="M180,789 L180,807" class="line-work"/><path d="M0,0 L-9,-4.5 L-9,4.5 z" class="head-work" transform="translate(180,807) rotate(90)"/>
<rect x="4" y="810" width="352" height="380" rx="14" class="zone"/><text x="16" y="831" class="label" text-anchor="start"><tspan x="16" dy="0">Whose word merges</tspan></text>
<rect x="16" y="842" width="328" height="78" rx="10" class="card"/><text x="28" y="870" class="title" text-anchor="start"><tspan x="28" dy="0">Your word</tspan></text><text x="28" y="888" class="" text-anchor="start"><tspan x="28" dy="0">The default basis. You said to merge that pull</tspan><tspan x="28" dy="16">request.</tspan></text>
<rect x="16" y="928" width="328" height="78" rx="10" class="card"/><text x="28" y="956" class="title" text-anchor="start"><tspan x="28" dy="0"><tspan class="code">yolo-green</tspan></tspan></text><text x="28" y="974" class="" text-anchor="start"><tspan x="28" dy="0">The project has <tspan class="code">"yolo": true</tspan>, and the beat</tspan><tspan x="28" dy="16">merges its green pull request by itself.</tspan></text>
<g data-part="attention"><rect x="16" y="1014" width="328" height="78" rx="10" class="card"/><text x="28" y="1042" class="title" text-anchor="start"><tspan x="28" dy="0">Never the decider</tspan></text><text x="28" y="1060" class="" text-anchor="start"><tspan x="28" dy="0">It answers no question about merging, so a merge</tspan><tspan x="28" dy="16">traces back to your word or yolo.</tspan></text><path d="M325,1032 l5,5.5 l-5,5.5" class="chevron"/></g>
<g data-part="beat"><rect x="16" y="1100" width="328" height="78" rx="10" class="card"/><text x="28" y="1128" class="title" text-anchor="start"><tspan x="28" dy="0">After the merge</tspan></text><text x="28" y="1146" class="" text-anchor="start"><tspan x="28" dy="0">A later beat records it, the chat posts it, and</tspan><tspan x="28" dy="16">a ship task that waited on it can start.</tspan></text><path d="M325,1118 l5,5.5 l-5,5.5" class="chevron"/></g>
</svg>
