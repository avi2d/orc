name: pr-text

on:
  # pull_request withholds secrets from forks, so this job must never check out pull request code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  # GitHub withholds secrets from a fork's review, so the job skips it and another trigger scans the text.
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  pr-text:
    if: (github.event_name != 'issue_comment' || github.event.issue.pull_request) && (!startsWith(github.event_name, 'pull_request_review') || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-text-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Only the repository secret decides the skip, and no pull request value reaches this step.
      - id: pack
        name: write the private pack or skip when none is configured
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
          IF_MISSING: skip
        run: bunx checks-ci secrets-pack
      - if: steps.pack.outputs.configured == 'true'
        id: scan
        run: bunx checks-pr-text "$NUMBER"
      # A comment's run reports on no pull request, so this posts a commit status.
      - if: ${{ !cancelled() }}
        name: report the result on the head commit
        env:
          CONTEXT: pr-text
          PULL_REQUEST: ${{ github.event.pull_request.number || github.event.issue.number }}
          JOB_STATUS: ${{ steps.pack.outputs.configured == 'false' && 'success' || steps.scan.outcome }}
          DESCRIPTION: "${{ steps.pack.outputs.configured == 'false' && 'scan skipped: no private pack is configured (CHECKS_SECRETS_PACK is unset)' || steps.scan.outcome == 'success' && 'the scan passed' || 'the scan failed or did not run' }}"
        run: bunx checks-ci commit-status
