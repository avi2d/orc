name: mutation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    paths: ["packages/*/src/**", "tests/unit/**", "stryker.conf.mjs", "package.json", "bun.lock", ".bun-version", "bunfig.toml"]
  workflow_dispatch:
    inputs:
      mode: { type: choice, options: [baseline, refresh], default: baseline }

jobs:
  mutation:
    uses: avi2d/workflows/.github/workflows/mutation.yml@569dec82a2517d4c8f6a7baef42645bccc3e6de6 # main: no tag holds this workflow yet
    permissions: { contents: read, actions: write, pull-requests: write }
    with:
      mode: ${{ github.event_name == 'pull_request' && 'compare' || inputs.mode || 'baseline' }}
