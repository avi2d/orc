name: whole-tree-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-tree-run
  cancel-in-progress: false

jobs:
  mutation:
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read
      actions: write

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx checks-test --tier=live --junit=reports/whole-tree-run-tests/live.xml || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whole-tree-run-tests
          path: reports/whole-tree-run-tests/
          retention-days: 1

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mkdir -p reports/whole-tree-run-gates && bunx checks-lint --whole-tree > reports/whole-tree-run-gates/gates.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whole-tree-run-gates
          path: reports/whole-tree-run-gates/
          retention-days: 1

  report:
    needs: [mutation, gates, tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutation-baseline-full
          path: reports/mutation
      - if: needs.gates.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: whole-tree-run-gates
          path: reports/whole-tree-run-gates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: whole-tree-run-tests
          path: reports/whole-tree-run-tests
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-whole-tree-run --mutation reports/mutation/mutation-baseline-full/mutation.json --tests reports/whole-tree-run-tests/live.xml ${{ needs.gates.result == 'success' && '--gates reports/whole-tree-run-gates/gates.log' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: whole-tree-run
          path: reports/whole-tree-run.json
          if-no-files-found: ignore
          retention-days: 90
