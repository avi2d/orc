name: night-run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: night-run
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          fetch-depth: 0
      - run: bunx checks-lint --night
