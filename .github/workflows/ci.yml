name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    # Untrusted PR code must not run on the self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code
      - name: write the private pack
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: |
          printf '%s' "$PACK" > "$RUNNER_TEMP/secrets-pack.json"
          echo "CHECKS_SECRETS_PACK=$RUNNER_TEMP/secrets-pack.json" >> "$GITHUB_ENV"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-commit-title
