name: flake
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: avi2d/workflows/setup@v1
      - run: bunx checks-flake --runs 10 --report flake-report.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: flake-report
          path: flake-report.json
          retention-days: 7
