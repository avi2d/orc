name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ref is a tag
        run: test "$GITHUB_REF_TYPE" = tag
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code
      - name: write the private pack
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: |
          printf '%s' "$PACK" > "$RUNNER_TEMP/secrets-pack.json"
          echo "CHECKS_SECRETS_PACK=$RUNNER_TEMP/secrets-pack.json" >> "$GITHUB_ENV"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: tag matches package version
        run: test "v$(bun -p "require('./packages/run/package.json').version")" = "$GITHUB_REF_NAME"
  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: ref is a tag
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code
      - name: tag matches package version
        run: test "v$(bun -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: extract release notes
        run: bunx checks-release-notes "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md"
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
