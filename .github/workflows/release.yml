name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          fetch-depth: 0
      - uses: avi2d/workflows/actions/secrets-pack@v2
        with:
          pack: ${{ secrets.CHECKS_SECRETS_PACK }}
      - run: bun run lint
      - run: bun run typecheck
  release:
    needs: checks
    permissions:
      contents: write
      id-token: write
    uses: avi2d/workflows/.github/workflows/release.yml@v2
    with:
      preflight-command: ./node_modules/.bin/checks-release-preflight release.yml
      tree-guard-command: bun scripts/tested-tree.ts
      build-command: bun run build
      clean-tree-command: git diff --exit-code
      github-release: true
